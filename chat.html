<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Free AI</title>

  <meta
    name="description"
    content="Free AI chat powered by OpenRouter."
  >

  <meta
    name="theme-color"
    content="#2b2d31"
  >

  <!-- Favicons -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="96x96"
    href="favicon-96x96.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="favicon-32x32.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="favicon-16x16.png"
  >

  <link
    rel="shortcut icon"
    href="favicon.ico"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="apple-touch-icon.png"
  >

  <link
    rel="manifest"
    href="site.webmanifest"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Sanitizer -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>

  <style>
    :root {
      --bg: #313338;
      --sidebar: #2b2d31;
      --sidebar-hover: #35373c;
      --sidebar-active: #3d4048;

      --surface: #313338;
      --surface-hover: #3a3c43;
      --input: #383a40;

      --text: #f2f3f5;
      --text-secondary: #b5bac1;
      --text-muted: #949ba4;

      --accent: #5865f2;
      --accent-hover: #4752c4;

      --success: #23a559;
      --danger: #ed4245;
      --warning: #faa61a;

      --user-message: #404249;

      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.11);

      --code-bg: #1e1f22;

      --shadow-sm:
        0 2px 8px rgba(0, 0, 0, 0.15);

      --shadow-md:
        0 10px 35px rgba(0, 0, 0, 0.22);

      --radius-sm: 5px;
      --radius-md: 7px;
      --radius-lg: 9px;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --sidebar: #f2f3f5;
      --sidebar-hover: #e7e9ec;
      --sidebar-active: #dfe2e5;

      --surface: #ffffff;
      --surface-hover: #eef0f2;
      --input: #ebedef;

      --text: #1e1f22;
      --text-secondary: #4e5058;
      --text-muted: #747f8d;

      --user-message: #e3e5e8;

      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.14);

      --code-bg: #1e1f22;

      --shadow-sm:
        0 2px 8px rgba(0, 0, 0, 0.06);

      --shadow-md:
        0 10px 35px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    ::selection {
      background:
        rgba(88, 101, 242, 0.45);

      color: white;
    }

    /* =====================================================
       APP
    ===================================================== */

    .app {
      width: 100%;
      height: 100vh;

      display: flex;

      background: var(--bg);
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      width: 276px;
      height: 100%;

      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: var(--sidebar);

      border-right:
        1px solid var(--border);
    }

    .sidebar-header {
      height: 58px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 12px;

      border-bottom:
        1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;

      min-width: 0;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;

      letter-spacing:
        -0.2px;
    }

    .new-chat-btn {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius:
        var(--radius-md);

      background:
        var(--accent);

      color: white;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .new-chat-btn:hover {
      background:
        var(--accent-hover);

      transform:
        translateY(-1px);
    }

    .new-chat-btn:active {
      transform:
        translateY(0);
    }

    .new-chat-btn svg {
      width: 17px;
      height: 17px;
    }

    /* =====================================================
       SEARCH
    ===================================================== */

    .sidebar-search-wrap {
      padding: 10px 10px 6px;
    }

    .sidebar-search {
      position: relative;

      display: flex;
      align-items: center;
    }

    .sidebar-search-icon {
      position: absolute;
      left: 9px;

      width: 15px;
      height: 15px;

      color: var(--text-muted);

      pointer-events: none;
    }

    .sidebar-search input {
      width: 100%;
      height: 34px;

      padding:
        0 10px 0 31px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-md);

      outline: none;

      background:
        var(--input);

      color:
        var(--text);

      font-size:
        12px;

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .sidebar-search input::placeholder {
      color:
        var(--text-muted);
    }

    .sidebar-search input:focus {
      border-color:
        rgba(88, 101, 242, 0.55);

      box-shadow:
        0 0 0 1px
        rgba(88, 101, 242, 0.14);
    }

    /* =====================================================
       CHAT LIST
    ===================================================== */

    .chats-list {
      flex: 1;

      overflow-y: auto;

      padding:
        4px 8px 10px;

      scrollbar-width:
        thin;

      scrollbar-color:
        var(--border-strong)
        transparent;
    }

    .chats-list::-webkit-scrollbar {
      width: 7px;
    }

    .chats-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .chats-list::-webkit-scrollbar-thumb {
      background:
        var(--border-strong);

      border-radius:
        999px;
    }

    .chat-group-label {
      padding:
        13px 8px 6px;

      color:
        var(--text-muted);

      font-size:
        10px;

      font-weight:
        700;

      text-transform:
        uppercase;

      letter-spacing:
        0.4px;
    }

    .chat-item {
      width: 100%;

      display: flex;
      align-items: center;

      min-height: 37px;

      margin-bottom: 2px;

      padding:
        6px 6px 6px 10px;

      border-radius:
        var(--radius-md);

      background:
        transparent;

      color:
        var(--text-secondary);

      cursor:
        pointer;

      transition:
        background 0.12s ease,
        color 0.12s ease;
    }

    .chat-item:hover {
      background:
        var(--sidebar-hover);

      color:
        var(--text);
    }

    .chat-item.active {
      background:
        var(--sidebar-active);

      color:
        var(--text);
    }

    .chat-item-title {
      min-width: 0;

      flex: 1;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      font-size: 12px;
    }

    .chat-item-actions {
      display: flex;
      align-items: center;

      gap: 1px;

      margin-left: 4px;

      opacity: 0;

      transition:
        opacity 0.12s ease;
    }

    .chat-item:hover .chat-item-actions,
    .chat-item.active .chat-item-actions {
      opacity: 1;
    }

    .chat-item-action {
      width: 25px;
      height: 25px;

      display: grid;
      place-items: center;

      border-radius: var(--radius-sm);

      background:
        transparent;

      color:
        var(--text-muted);

      cursor:
        pointer;
    }

    .chat-item-action:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .chat-item-action.delete:hover {
      background:
        rgba(237, 66, 69, 0.12);

      color:
        var(--danger);
    }

    .chat-item-action svg {
      width: 13px;
      height: 13px;
    }

    .chats-empty {
      padding:
        24px 10px;

      color:
        var(--text-muted);

      font-size:
        11px;

      text-align:
        center;

      line-height:
        1.5;
    }

    /* =====================================================
       USER PANEL
    ===================================================== */

    .user-panel {
      flex-shrink: 0;

      padding:
        10px;

      border-top:
        1px solid var(--border);
    }

    .user-info {
      display: flex;
      align-items: center;

      gap: 9px;

      padding: 5px;
    }

    .avatar {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      background:
        var(--surface-hover);
    }

    .user-details {
      min-width: 0;
      flex: 1;
    }

    .user-name,
    .user-email {
      overflow: hidden;

      white-space: nowrap;

      text-overflow:
        ellipsis;
    }

    .user-name {
      font-size: 12px;
      font-weight: 600;
    }

    .user-email {
      margin-top: 2px;

      color:
        var(--text-muted);

      font-size:
        10px;
    }

    .signout-btn {
      width: 100%;

      margin-top: 4px;

      padding: 8px;

      border-radius:
        var(--radius-md);

      background:
        transparent;

      color:
        var(--text-muted);

      font-size: 11px;

      text-align:
        left;

      cursor:
        pointer;

      transition:
        background 0.12s ease,
        color 0.12s ease;
    }

    .signout-btn:hover {
      background:
        rgba(237, 66, 69, 0.10);

      color:
        var(--danger);
    }

    /* =====================================================
       MAIN CHAT
    ===================================================== */

    .chat {
      min-width: 0;
      height: 100%;

      flex: 1;

      display: flex;
      flex-direction: column;

      background:
        var(--surface);
    }

    /* =====================================================
       CHAT HEADER
    ===================================================== */

    .chat-header {
      height: 58px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        0 14px;

      border-bottom:
        1px solid var(--border);
    }

    .current-tab {
      min-width: 0;

      max-width:
        min(72%, 760px);

      display: flex;
      align-items: center;

      gap: 7px;

      padding:
        3px 4px 3px 10px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-md);

      background:
        var(--surface-hover);
    }

    .current-tab-title {
      min-width: 0;

      overflow: hidden;

      white-space: nowrap;

      text-overflow:
        ellipsis;

      font-size:
        12px;

      font-weight:
        600;
    }

    .current-tab-model {
      flex-shrink: 0;

      color:
        var(--text-muted);

      font-size:
        9px;
    }

    .close-tab-btn {
      width: 27px;
      height: 27px;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      border-radius:
        var(--radius-sm);

      background:
        transparent;

      color:
        var(--text-muted);

      cursor:
        pointer;
    }

    .close-tab-btn:hover {
      background:
        rgba(237, 66, 69, 0.12);

      color:
        var(--danger);
    }

    .close-tab-btn svg {
      width: 14px;
      height: 14px;
    }

    .header-actions {
      display: flex;
      align-items: center;

      gap: 4px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius:
        var(--radius-md);

      background:
        transparent;

      color:
        var(--text-secondary);

      cursor:
        pointer;

      transition:
        background 0.12s ease,
        color 0.12s ease;
    }

    .icon-btn:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .icon-btn svg {
      width: 17px;
      height: 17px;
    }

    /* =====================================================
       MESSAGES
    ===================================================== */

    .messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        24px 0 30px;

      scrollbar-width:
        thin;

      scrollbar-color:
        var(--border-strong)
        transparent;
    }

    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .messages::-webkit-scrollbar-track {
      background:
        transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background:
        var(--border-strong);

      border-radius:
        999px;
    }

    .empty-state {
      max-width:
        650px;

      margin:
        90px auto 0;

      padding:
        0 20px;

      text-align:
        center;
    }

    .empty-state h1 {
      margin-bottom:
        10px;

      font-size:
        29px;

      letter-spacing:
        -0.6px;
    }

    .empty-state p {
      max-width:
        500px;

      margin:
        0 auto;

      color:
        var(--text-secondary);

      font-size:
        14px;

      line-height:
        1.65;
    }

    .message-row {
      width: 100%;

      padding:
        9px 24px;

      animation:
        messageIn 0.18s ease;
    }

    .message-row:hover {
      background:
        rgba(0, 0, 0, 0.045);
    }

    [data-theme="dark"]
    .message-row:hover {
      background:
        rgba(0, 0, 0, 0.075);
    }

    .message-container {
      max-width:
        860px;

      margin:
        0 auto;
    }

    .message {
      min-width:
        0;
    }

    .message.user .message-content {
      width:
        fit-content;

      max-width:
        82%;

      margin-left:
        auto;

      padding:
        10px 14px;

      border-radius:
        9px 9px 2px 9px;

      background:
        var(--user-message);

      color:
        var(--text);

      white-space:
        pre-wrap;

      line-height:
        1.52;

      font-size:
        14px;
    }

    .message.ai .message-content {
      font-size:
        14px;

      line-height:
        1.68;

      word-break:
        break-word;
    }

    /* =====================================================
       MESSAGE TOOLBAR
    ===================================================== */

    .message-toolbar {
      display:
        flex;

      align-items:
        center;

      gap:
        3px;

      margin-top:
        6px;

      opacity:
        0;

      transition:
        opacity 0.14s ease;
    }

    .message-row:hover
    .message-toolbar {
      opacity:
        1;
    }

    .message-action {
      display:
        inline-flex;

      align-items:
        center;

      gap:
        4px;

      min-height:
        27px;

      padding:
        4px 7px;

      border-radius:
        var(--radius-sm);

      background:
        transparent;

      color:
        var(--text-muted);

      font-size:
        10px;

      cursor:
        pointer;

      transition:
        background 0.12s ease,
        color 0.12s ease;
    }

    .message-action:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .message-action.retry:hover {
      background:
        rgba(250, 166, 26, 0.10);

      color:
        var(--warning);
    }

    .message-action.delete:hover {
      background:
        rgba(237, 66, 69, 0.12);

      color:
        var(--danger);
    }

    .message-action svg {
      width:
        13px;

      height:
        13px;
    }

    /* =====================================================
       MARKDOWN
    ===================================================== */

    .message-content p {
      margin-bottom:
        12px;
    }

    .message-content p:last-child {
      margin-bottom:
        0;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3,
    .message-content h4 {
      margin:
        20px 0 9px;

      line-height:
        1.35;
    }

    .message-content h1 {
      font-size:
        23px;
    }

    .message-content h2 {
      font-size:
        19px;
    }

    .message-content h3 {
      font-size:
        16px;
    }

    .message-content ul,
    .message-content ol {
      margin:
        9px 0 14px;

      padding-left:
        22px;
    }

    .message-content li {
      margin:
        5px 0;
    }

    .message-content blockquote {
      margin:
        14px 0;

      padding:
        9px 13px;

      border-left:
        3px solid var(--accent);

      border-radius:
        0 var(--radius-sm) var(--radius-sm) 0;

      background:
        rgba(88, 101, 242, 0.08);

      color:
        var(--text-secondary);
    }

    .message-content a {
      color:
        #8ea1ff;

      text-decoration:
        underline;

      text-underline-offset:
        2px;
    }

    .message-content code:not(pre code) {
      padding:
        2px 5px;

      border-radius:
        4px;

      background:
        rgba(88, 101, 242, 0.12);

      color:
        #d7d9ff;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size:
        0.88em;
    }

    /* =====================================================
       CODE BLOCK
    ===================================================== */

    .code-wrapper {
      margin:
        14px 0;

      overflow:
        hidden;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-md);

      background:
        var(--code-bg);
    }

    .code-header {
      min-height:
        34px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        0 10px;

      background:
        #1e1f22;

      color:
        #949ba4;

      font-family:
        monospace;

      font-size:
        10px;
    }

    .code-copy {
      padding:
        4px 8px;

      border-radius:
        4px;

      background:
        rgba(255, 255, 255, 0.06);

      color:
        #b5bac1;

      cursor:
        pointer;

      font-size:
        10px;
    }

    .code-copy:hover {
      background:
        rgba(255, 255, 255, 0.12);

      color:
        white;
    }

    .message-content pre {
      margin:
        0;

      padding:
        14px;

      overflow-x:
        auto;

      background:
        var(--code-bg);

      color:
        #e6edf3;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size:
        12px;

      line-height:
        1.6;
    }

    /* =====================================================
       TYPING
    ===================================================== */

    .typing {
      display:
        inline-flex;

      align-items:
        center;

      gap:
        4px;

      padding:
        8px 0;
    }

    .typing-dot {
      width:
        6px;

      height:
        6px;

      border-radius:
        50%;

      background:
        var(--text-muted);

      animation:
        typing 1.1s
        infinite
        ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay:
        0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay:
        0.30s;
    }

    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer-wrap {
      flex-shrink:
        0;

      padding:
        10px 18px 16px;

      background:
        var(--surface);
    }

    .composer {
      display:
        flex;

      align-items:
        flex-end;

      gap:
        7px;

      padding:
        8px;

      border:
        1px solid var(--border-strong);

      border-radius:
        var(--radius-lg);

      background:
        var(--input);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .composer:focus-within {
      border-color:
        rgba(88, 101, 242, 0.62);

      box-shadow:
        0 0 0 1px
        rgba(88, 101, 242, 0.14);
    }

    .web-search-btn {
      width:
        40px;

      height:
        40px;

      flex-shrink:
        0;

      display:
        grid;

      place-items:
        center;

      border-radius:
        var(--radius-md);

      background:
        transparent;

      color:
        var(--text-muted);

      cursor:
        pointer;

      transition:
        background 0.12s ease,
        color 0.12s ease;
    }

    .web-search-btn:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .web-search-btn.active {
      background:
        rgba(88, 101, 242, 0.18);

      color:
        #aab1ff;
    }

    .web-search-btn svg {
      width:
        18px;

      height:
        18px;
    }

    .composer textarea {
      flex:
        1;

      min-height:
        40px;

      max-height:
        180px;

      resize:
        none;

      border:
        0;

      outline:
        0;

      background:
        transparent;

      color:
        var(--text);

      padding:
        9px 2px;

      font-size:
        14px;

      line-height:
        1.5;
    }

    .composer textarea::placeholder {
      color:
        var(--text-muted);
    }

    .send-btn {
      width:
        40px;

      height:
        40px;

      flex-shrink:
        0;

      display:
        grid;

      place-items:
        center;

      border-radius:
        var(--radius-md);

      background:
        var(--accent);

      color:
        white;

      cursor:
        pointer;

      transition:
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .send-btn:hover:not(:disabled) {
      background:
        var(--accent-hover);
    }

    .send-btn.stop {
      background:
        var(--danger);
    }

    .send-btn:disabled {
      opacity:
        0.38;

      cursor:
        not-allowed;
    }

    .send-btn svg {
      width:
        17px;

      height:
        17px;
    }

    .composer-footer {
      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        6px 2px 0;

      color:
        var(--text-muted);

      font-size:
        9px;
    }

    .search-status.active {
      color:
        #8ea1ff;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position:
        fixed;

      left:
        50%;

      bottom:
        24px;

      z-index:
        100;

      transform:
        translate(-50%, 15px);

      padding:
        9px 13px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-md);

      background:
        #111214;

      color:
        white;

      font-size:
        11px;

      opacity:
        0;

      pointer-events:
        none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .toast.show {
      opacity:
        1;

      transform:
        translate(-50%, 0);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 800px) {
      .sidebar {
        width:
          230px;
      }

      .message-row {
        padding-left:
          14px;

        padding-right:
          14px;
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        width:
          205px;
      }

      .current-tab-model {
        display:
          none;
      }

      .composer-wrap {
        padding:
          8px 10px 10px;
      }
    }

    @media (max-width: 500px) {
      .sidebar {
        width:
          180px;
      }

      .sidebar-search-wrap {
        padding:
          8px 7px 5px;
      }

      .chats-list {
        padding-left:
          6px;

        padding-right:
          6px;
      }

      .message.user .message-content {
        max-width:
          92%;
      }

      .message-toolbar {
        opacity:
          1;
      }

      .message-action span {
        display:
          none;
      }

      .composer-footer {
        font-size:
          8px;
      }
    }

    @keyframes messageIn {
      from {
        opacity:
          0;

        transform:
          translateY(4px);
      }

      to {
        opacity:
          1;

        transform:
          translateY(0);
      }
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity:
          0.35;

        transform:
          translateY(0);
      }

      30% {
        opacity:
          1;

        transform:
          translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration:
          0.01ms !important;

        transition-duration:
          0.01ms !important;

        scroll-behavior:
          auto !important;
      }
    }
  </style>
</head>


<body>

<div class="app">

  <!-- ===================================================
       SIDEBAR
  ==================================================== -->

  <aside class="sidebar">

    <header class="sidebar-header">

      <div class="brand">
        <span class="brand-name">
          Free AI
        </span>
      </div>

      <button
        id="newChatBtn"
        class="new-chat-btn"
        type="button"
        title="New chat"
        aria-label="New chat"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 5v14"/>
          <path d="M5 12h14"/>
        </svg>

      </button>

    </header>


    <div class="sidebar-search-wrap">

      <div class="sidebar-search">

        <svg
          class="sidebar-search-icon"
          viewBox="0 0 24 24"

          stroke="currentColor"
          stroke-width="2"

        >

  <!-- ===================================================

  <main class="chat">

    <header class="chat-header">

      <div

        <span

        <button

      <div class="header-actions">

          >

            <circle

            />

            <path
              d="
                M12 2v2
                M12 20v2
                M4.93 4.93l1.42 1.42
                M17.65 17.65l1.42 1.42
                M2 12h2
                M20 12h2
                M4.93 19.07l1.42-1.42

    <!-- ===================================================

          >

                -9-4
                20-7z

          </svg>

      <div class="composer-footer">

        <span

          Web search off

    </div>

  </main>

</div>


<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>


<script>
  /* =========================================================
     CONFIGURATION
  ========================================================= */

  const SUPABASE_URL =
    "https://houpacapqrrvfqzzrlxs.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_YlFSX-js_1YUsqGxc4BeHQ_bhmlE5Le";

  const WORKER_URL =
    "https://api.ai09.workers.dev";

  const LOGIN_PAGE =
    "./index.html";

  const CHAT_STORAGE_KEY =
    "free-ai-current-chat";

  const THEME_KEY =
    "free-ai-theme";


  /* =========================================================
     SUPABASE
  ========================================================= */

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession:
            true,

          autoRefreshToken:
            true,

          detectSessionInUrl:
            true
        }
      }
    );


  /* =========================================================
     DOM
  ========================================================= */

  const newChatBtn =
    document.getElementById(
      "newChatBtn"
    );

  const chatSearch =
    document.getElementById(
      "chatSearch"
    );

  const chatsList =
    document.getElementById(
      "chatsList"
    );

  const userAvatar =
    document.getElementById(
      "userAvatar"
    );

  const userName =
    document.getElementById(
      "userName"
    );

  const userEmail =
    document.getElementById(
      "userEmail"
    );

  const signOutBtn =
    document.getElementById(
      "signOutBtn"
    );

  const currentTab =
    document.getElementById(
      "currentTab"
    );

  const currentTabTitle =
    document.getElementById(
      "currentTabTitle"
    );

  const closeTabBtn =
    document.getElementById(
      "closeTabBtn"
    );

  const themeBtn =
    document.getElementById(
      "themeBtn"
    );

  const themeIcon =
    document.getElementById(
      "themeIcon"
    );

  const messagesEl =
    document.getElementById(
      "messages"
    );

  const webSearchBtn =
    document.getElementById(
      "webSearchBtn"
    );

  const searchStatus =
    document.getElementById(
      "searchStatus"
    );

  const userInput =
    document.getElementById(
      "userInput"
    );

  const sendBtn =
    document.getElementById(
      "sendBtn"
    );

  const sendIcon =
    document.getElementById(
      "sendIcon"
    );

  const toastEl =
    document.getElementById(
      "toast"
    );


  /* =========================================================
     STATE
  ========================================================= */

  let currentUser =
    null;

  let currentSession =
    null;

  let currentChat =
    null;

  let allChats =
    [];

  let messageRecords =
    [];

  let isGenerating =
    false;

  let controller =
    null;

  let webSearchEnabled =
    false;

  let chatSearchQuery =
    "";

  let toastTimer =
    null;


  /* =========================================================
     CONFIGURATION CHECK
  ========================================================= */

  function isConfigured() {

    return (
      SUPABASE_URL &&
      SUPABASE_URL.startsWith("https://") &&

      SUPABASE_PUBLISHABLE_KEY &&
      !SUPABASE_PUBLISHABLE_KEY.includes(
        "YOUR_"
      ) &&

      WORKER_URL &&
      WORKER_URL.startsWith("https://") &&
      !WORKER_URL.includes(
        "YOUR_"
      )
    );
  }


  /* =========================================================
     TOAST
  ========================================================= */

  function showToast(
    message
  ) {

    toastEl.textContent =
      message;

    toastEl.classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {
          toastEl.classList.remove(
            "show"
          );
        },
        2500
      );
  }


  /* =========================================================
     THEME
  ========================================================= */

  function loadTheme() {

    const saved =
      localStorage.getItem(
        THEME_KEY
      );

    if (saved === "light" ||
        saved === "dark") {

      document.documentElement
        .dataset.theme =
        saved;

      return;
    }


    document.documentElement
      .dataset.theme =
      "dark";
  }


  function updateThemeIcon() {

    const dark =
      document.documentElement
        .dataset.theme ===
      "dark";


    if (dark) {

      themeIcon.innerHTML = `
        <circle
          cx="12"
          cy="12"
          r="4"
        />

        <path
          d="
            M12 2v2
            M12 20v2
            M4.93 4.93l1.42 1.42
            M17.65 17.65l1.42 1.42
            M2 12h2
            M20 12h2
            M4.93 19.07l1.42-1.42
            M17.65 6.35l1.42-1.42
          "
        />
      `;

      themeBtn.title =
        "Switch to light theme";

    } else {

      themeIcon.innerHTML = `
        <path
          d="
            M21 12.8
            A8.5 8.5 0 1 1
            11.2 3
            A6.7 6.7 0 0 0
            21 12.8z
          "
        />
      `;

      themeBtn.title =
        "Switch to dark theme";
    }
  }


  themeBtn.addEventListener(
    "click",
    () => {

      const current =
        document.documentElement
          .dataset.theme;

      const next =
        current === "dark"
          ? "light"
          : "dark";


      document.documentElement
        .dataset.theme =
        next;


      localStorage.setItem(
        THEME_KEY,
        next
      );


      updateThemeIcon();
    }
  );


  loadTheme();
  updateThemeIcon();


  /* =========================================================
     AUTH
  ========================================================= */

  async function ensureFreshSession() {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .refreshSession();


    if (
      error ||
      !data?.session
    ) {

      console.error(
        "Session refresh failed:",
        error
      );


      await supabaseClient.auth
        .signOut();


      window.location.replace(
        LOGIN_PAGE
      );


      return null;
    }


    currentSession =
      data.session;

    currentUser =
      data.session.user;


    return data.session;
  }


  async function initializeAuth() {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();


    if (
      error ||
      !data?.session
    ) {

      window.location.replace(
        LOGIN_PAGE
      );

      return false;
    }


    currentSession =
      data.session;

    currentUser =
      data.session.user;


    const refreshed =
      await ensureFreshSession();


    return Boolean(
      refreshed
    );
  }


  supabaseClient.auth
    .onAuthStateChange(
      (
        event,
        session
      ) => {

        currentSession =
          session;

        currentUser =
          session?.user ||
          null;


        if (!session) {

          window.location.replace(
            LOGIN_PAGE
          );
        }
      }
    );


  /* =========================================================
     USER UI
  ========================================================= */

  function fallbackAvatar(
    name
  ) {

    const letter =
      (
        name ||
        "U"
      )
        .trim()
        .charAt(0)
        .toUpperCase() ||
      "U";


    return (
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(
        `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="64"
          height="64"
          viewBox="0 0 64 64"
        >
          <rect
            width="64"
            height="64"
            fill="#5865f2"
          />

          <text
            x="50%"
            y="54%"
            dominant-baseline="middle"
            text-anchor="middle"
            fill="white"
            font-size="28"
            font-family="Arial"
            font-weight="bold"
          >
            ${letter}
          </text>
        </svg>
        `
      )
    );
  }


  function renderUser() {

    if (!currentUser) {
      return;
    }


    const metadata =
      currentUser.user_metadata ||
      {};


    const name =
      metadata.full_name ||
      metadata.name ||
      currentUser.email ||
      "User";


    userName.textContent =
      name;

    userEmail.textContent =
      currentUser.email ||
      "";


    userAvatar.src =
      metadata.avatar_url ||
      metadata.picture ||
      fallbackAvatar(
        name
      );
  }


  /* =========================================================
     CURRENT TAB
  ========================================================= */

  function updateCurrentTab() {

    if (!currentChat) {

      currentTab.hidden =
        true;

      return;
    }


    currentTab.hidden =
      false;


    currentTabTitle.textContent =
      currentChat.title ||
      "New chat";
  }


  closeTabBtn.addEventListener(
    "click",
    () => {

      if (
        isGenerating
      ) {

        stopGeneration();
      }


      currentChat =
        null;

      messageRecords =
        [];


      localStorage.removeItem(
        CHAT_STORAGE_KEY
      );


      updateCurrentTab();
      renderMessages();
      renderChatsList();


      userInput.focus();
    }
  );


  /* =========================================================
     CHAT TITLES / DATE GROUPS
  ========================================================= */

  function makeChatTitle(
    text
  ) {

    const clean =
      String(text || "")
        .replace(
          /\s+/g,
          " "
        )
        .trim();


    if (!clean) {
      return "New chat";
    }


    if (
      clean.length <= 42
    ) {

      return clean;
    }


    return (
      clean.slice(
        0,
        39
      ) +
      "..."
    );
  }


  function dateGroupLabel(
    isoString
  ) {

    const then =
      new Date(
        isoString
      );


    const now =
      new Date();


    const startOfDay =
      date => new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );


    const diffDays =
      Math.round(
        (
          startOfDay(now) -
          startOfDay(then)
        ) /
        86400000
      );


    if (diffDays <= 0) {
      return "Today";
    }


    if (diffDays === 1) {
      return "Yesterday";
    }


    if (diffDays <= 7) {
      return "Previous 7 days";
    }


    if (diffDays <= 30) {
      return "Previous 30 days";
    }


    return "Older";
  }


  /* =========================================================
     CHAT LIST
  ========================================================= */

  function renderChatsList() {

    chatsList.innerHTML =
      "";


    const query =
      chatSearchQuery
        .trim()
        .toLowerCase();


    const filtered =
      query

        ? allChats.filter(
            chat =>
              (
                chat.title ||
                "New chat"
              )
                .toLowerCase()
                .includes(
                  query
                )
          )

        : allChats;


    if (
      filtered.length ===
      0
    ) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "chats-empty";


      empty.textContent =
        query
          ? "No chats match your search."
          : "No conversations yet.";


      chatsList.appendChild(
        empty
      );


      return;
    }


    let lastGroup =
      null;


    for (
      const chat
      of filtered
    ) {

      const group =
        dateGroupLabel(
          chat.updated_at ||
          chat.created_at
        );


      if (
        group !==
        lastGroup
      ) {

        const label =
          document.createElement(
            "div"
          );


        label.className =
          "chat-group-label";


        label.textContent =
          group;


        chatsList.appendChild(
          label
        );


        lastGroup =
          group;
      }


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "chat-item";


      if (
        currentChat &&
        currentChat.id ===
          chat.id
      ) {

        item.classList.add(
          "active"
        );
      }


      const title =
        document.createElement(
          "span"
        );


      title.className =
        "chat-item-title";


      title.textContent =
        chat.title ||
        "New chat";


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "chat-item-actions";


      /*
       * Close currently open tab.
       */

      const closeBtn =
        document.createElement(
          "button"
        );


      closeBtn.type =
        "button";

      closeBtn.className =
        "chat-item-action";

      closeBtn.title =
        "Close tab";

      closeBtn.setAttribute(
        "aria-label",
        "Close tab"
      );


      closeBtn.innerHTML = `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 6l12 12"/>
          <path d="M18 6L6 18"/>
        </svg>
      `;


      closeBtn.addEventListener(
        "click",
        event => {

          event.stopPropagation();


          if (
            currentChat &&
            currentChat.id ===
              chat.id
          ) {

            closeTabBtn.click();
          }
        }
      );


      /*
       * Delete chat permanently.
       */

      const deleteBtn =
        document.createElement(
          "button"
        );


      deleteBtn.type =
        "button";

      deleteBtn.className =
        "chat-item-action delete";

      deleteBtn.title =
        "Delete chat";

      deleteBtn.setAttribute(
        "aria-label",
        "Delete chat"
      );


      deleteBtn.innerHTML = `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 6h18"/>
          <path d="M8 6V4h8v2"/>
          <path d="M19 6l-1 15H6L5 6"/>
          <path d="M10 11v6"/>
          <path d="M14 11v6"/>
        </svg>
      `;


      deleteBtn.addEventListener(
        "click",
        async event => {

          event.stopPropagation();

          await deleteChat(
            chat.id
          );
        }
      );


      actions.appendChild(
        closeBtn
      );

      actions.appendChild(
        deleteBtn
      );


      item.appendChild(
        title
      );

      item.appendChild(
        actions
      );


      item.addEventListener(
        "click",
        () => {

          openChat(
            chat.id
          );
        }
      );


      chatsList.appendChild(
        item
      );
    }
  }


  async function loadChats() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("chats")
        .select(
          "id,user_id,title,created_at,updated_at"
        )
        .order(
          "updated_at",
          {
            ascending:
              false
          }
        );


    if (error) {

      console.error(
        "loadChats:",
        error
      );


      showToast(
        error.message ||
          "Could not load chats."
      );

  /* =========================================================
     CODE BLOCKS
  ========================================================= */

  function enhanceCodeBlocks(
    container
  ) {

    container
      .querySelectorAll("pre")
      .forEach(
        pre => {

          if (
            pre.parentElement &&
            pre.parentElement
              .classList
              .contains(
                "code-wrapper"
              )
          ) {

            return;
          }


          const code =
            pre.querySelector(
              "code"
            );


          if (!code) {
            return;
          }


          const wrapper =
            document.createElement(
              "div"
            );


          wrapper.className =
            "code-wrapper";


          const header =
            document.createElement(
              "div"
            );


          header.className =
            "code-header";


          const language =
            document.createElement(
              "span"
            );


          const languageClass =
            Array.from(
              code.classList
            ).find(
              value =>
                value.startsWith(
                  "language-"
                )
            );


          language.textContent =
            languageClass
              ? languageClass.replace(
                  "language-",
                  ""
                )
              : "code";


          const copyButton =
            document.createElement(
              "button"
            );


          copyButton.type =
            "button";

          copyButton.className =
            "code-copy";

          copyButton.textContent =
            "Copy";


          copyButton.addEventListener(
            "click",
            async () => {

              try {

                await navigator
                  .clipboard
                  .writeText(
                    code.textContent
                  );


                copyButton.textContent =
                  "Copied";


                setTimeout(
                  () => {

                    copyButton.textContent =
                      "Copy";

                  },
                  1200
                );

              } catch {

                showToast(
                  "Could not copy code."
                );
              }
            }
          );


          header.appendChild(
            language
          );

          header.appendChild(
            copyButton
          );


          pre.parentNode
            .insertBefore(
              wrapper,
              pre
            );


          wrapper.appendChild(
            header
          );

          wrapper.appendChild(
            pre
          );
        }
      );
  }

  /* =========================================================
     RETRY
  ========================================================= */

  async function retryMessage(
    index
  ) {

    if (
      isGenerating
    ) {

      showToast(
        "Please wait for the current response."
      );


      return;
    }


    if (!currentChat) {
      return;
    }


    const selected =
      messageRecords[index];


    if (!selected) {
      return;
    }


    let userIndex =
      index;


    /*
     * Retrying an assistant message
     * regenerates the answer to the
     * previous user message.
     */

    if (
      selected.role ===
      "assistant"
    ) {

      for (
        let i = index - 1;
        i >= 0;
        i--
      ) {

        if (
          messageRecords[i].role ===
          "user"
        ) {

          userIndex =
            i;

          break;
        }
      }
    }


    const userMessage =
      messageRecords[userIndex];


    if (
      !userMessage ||
      userMessage.role !==
        "user"
    ) {

      showToast(
        "Could not find the message to retry."
      );


      return;
    }


    /*
     * Delete everything after the
     * selected user message.
     */

    const followingMessages =
      messageRecords.slice(
        userIndex + 1
      );


    if (
      followingMessages.length >
      0
    ) {

      const ids =
        followingMessages.map(
          message =>
            message.id
        );


      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .delete()
          .in(
            "id",
            ids
          )
          .eq(
            "chat_id",
            currentChat.id
          );


      if (error) {

        console.error(
          "retry cleanup:",
          error
        );


        showToast(
          error.message ||
            "Could not prepare retry."
        );


        return;
      }
    }


    messageRecords =
      messageRecords.slice(
        0,
        userIndex + 1
      );


    renderMessages();


    await touchChat();


    await generateResponse();
  }

  ========================================================= */

  function createStreamingMessage() {

    const row =

      "message-row";

  /* =========================================================
     STREAM READER
  ========================================================= */

  async function readStream(
    response,
    contentElement
  ) {

    if (
      !response.body
    ) {

      throw new Error(
        "The Worker did not return a stream."
      );
    }


    const reader =
      response.body
        .getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    let buffer =
      "";

    let answer =
      "";


    while (true) {

      const {
        value,
        done
      } =
        await reader.read();


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream:
              true
          }
        );


      const lines =
        buffer.split(
          "\n"
        );


      buffer =
        lines.pop() ||
        "";


      for (
        const rawLine
        of lines
      ) {

        const line =
          rawLine.trim();


        if (
          !line.startsWith(
            "data:"
          )
        ) {

          continue;
        }


        const payload =
          line
            .slice(5)
            .trim();


        if (
          payload ===
          "[DONE]"
        ) {

          continue;
        }


        let parsed;


        try {

          parsed =
            JSON.parse(
              payload
            );

        } catch {

          continue;
        }


        const delta =
          parsed
            ?.choices?.[0]
            ?.delta
            ?.content;


        if (
          typeof delta !==
          "string"
        ) {

          continue;
        }


        answer +=
          delta;


        contentElement.innerHTML =
          renderMarkdown(
            answer
          );


        enhanceCodeBlocks(
          contentElement
        );


        scrollToBottom();
      }
    }


    return answer;
  }


  /* =========================================================
     BUILD WORKER MESSAGES
  ========================================================= */

  function buildWorkerMessages() {

    return messageRecords
      .filter(
        message =>
          message.role ===
            "user" ||
          message.role ===
            "assistant"
      )
      .map(
        message => ({
          role:
            message.role,

          content:
            message.content
        })
      );
  }


  /* =========================================================
     WORKER REQUEST
  ========================================================= */

  async function callWorker(
    session
  ) {

    return fetch(
      WORKER_URL,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Authorization":
            `Bearer ${session.access_token}`
        },

        signal:
          controller.signal,

        body:
          JSON.stringify({

            messages:
              buildWorkerMessages(),

            web_search:
              webSearchEnabled,

            temperature:
              0.7,

            max_tokens:
              4096,

            stream:
              true
          })
      }
    );
  }


  /* =========================================================
     GENERATE RESPONSE
  ========================================================= */

  async function generateResponse() {

    if (!currentChat) {
      return;
    }


    if (
      isGenerating
    ) {
      return;
    }


    isGenerating =
      true;

    controller =
      new AbortController();


    updateSendButton();


    const streamMessage =
      createStreamingMessage();


    try {

      /*
       * Refresh first.
       */

      let session =
        await ensureFreshSession();


      if (!session) {
        return;
      }


      let response =
        await callWorker(
          session
        );


      /*
       * Retry once if the Worker says
       * the token is invalid/expired.
       */

      if (
        response.status ===
        401
      ) {

        showToast(
          "Refreshing session..."
        );


        session =
          await ensureFreshSession();


        if (!session) {
          return;
        }


        response =
          await callWorker(
            session
          );
      }


      if (
        !response.ok
      ) {

        let errorMessage =
          `Request failed (${response.status}).`;


        try {

          const errorData =
            await response.json();


          if (
            typeof errorData.error ===
            "string"
          ) {

            errorMessage =
              errorData.error;

          } else if (
            errorData?.error?.message
          ) {

            errorMessage =
              errorData.error.message;
          }

        } catch {
          // Ignore malformed errors.
        }


        throw new Error(
          errorMessage
        );
      }


      const answer =
        await readStream(
          response,
          streamMessage.content
        );


      if (
        !answer.trim()
      ) {

        throw new Error(
          "The AI returned an empty response."
        );
      }


      /*
       * Remove temporary streamed row
       * and persist the final answer.
       */

      streamMessage.row.remove();


      await saveMessage(
        "assistant",
        answer
      );


      await touchChat();


      renderMessages();
      await loadChats();


    } catch (error) {

      streamMessage.row.remove();


      if (
        error.name ===
        "AbortError"
      ) {

        showToast(
          "Generation stopped."
        );

        return;
      }


      console.error(
        "AI request failed:",
        error
      );


      /*
       * Keep the error visible in the
       * conversation UI, but don't save
       * it as an actual assistant message.
       */

      const errorRow =
        document.createElement(
          "div"
        );


      errorRow.className =
        "message-row";


      const errorContainer =
        document.createElement(
          "div"
        );


      errorContainer.className =
        "message-container";


      const errorMessage =
        document.createElement(
          "article"
        );


      errorMessage.className =
        "message ai";


      const errorContent =
        document.createElement(
          "div"
        );


      errorContent.className =
        "message-content";


      errorContent.innerHTML =
        renderMarkdown(
          `### Something went wrong\n\n${error.message || "Unable to contact the AI service."}`
        );


      errorMessage.appendChild(
        errorContent
      );


      errorContainer.appendChild(
        errorMessage
      );


      errorRow.appendChild(
        errorContainer
      );


      messagesEl.appendChild(
        errorRow
      );


      scrollToBottom();

    } finally {

      isGenerating =
        false;

      controller =
        null;


      updateSendButton();


      userInput.focus();
    }
  }


  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  async function sendMessage() {

    if (
      isGenerating
    ) {

      stopGeneration();

      return;
    }


    const text =
      userInput.value
        .trim();


    if (!text) {
      return;
    }


    if (
      !isConfigured()
    ) {

      showToast(
        "Configure Supabase and the Worker first."
      );

      return;
    }


    if (
      !currentUser
    ) {

      showToast(
        "Please sign in again."
      );

      return;
    }


    /*
     * Create the chat if none is open.
     */

    if (!currentChat) {

      currentChat =
        await createChat(
          makeChatTitle(
            text
          )
        );


      if (!currentChat) {
        return;
      }
    }


    /*
     * Auto-title a blank chat.
     */

    if (
      currentChat.title ===
      "New chat"
    ) {

      await updateChatTitle(
        makeChatTitle(
          text
        )
      );
    }


    userInput.value =
      "";

    resizeInput();


    try {

      await saveMessage(
        "user",
        text
      );


      await touchChat();


      renderMessages();
      await loadChats();


      await generateResponse();

    } catch (error) {

      console.error(
        "Sending message failed:",
        error
      );


      showToast(
        error.message ||
          "Could not send message."
      );
    }
  }


  /* =========================================================
     STOP GENERATION
  ========================================================= */

  function stopGeneration() {

    if (
      controller
    ) {

      controller.abort();
    }


    controller =
      null;

    isGenerating =
      false;


    updateSendButton();

    userInput.focus();
  }


  /* =========================================================
     SEND BUTTON STATE
  ========================================================= */

  function updateSendButton() {

    if (
      isGenerating
    ) {

      sendBtn.disabled =
        false;

      sendBtn.classList.add(
        "stop"
      );


      sendBtn.title =
        "Stop generation";


      sendBtn.setAttribute(
        "aria-label",
        "Stop generation"
      );


      sendIcon.innerHTML = `
        <rect
          x="7"
          y="7"
          width="10"
          height="10"
          rx="2"
        />
      `;


      return;
    }


    sendBtn.classList.remove(
      "stop"
    );


    sendBtn.disabled =
      !userInput.value.trim();


    sendBtn.title =
      "Send message";


    sendBtn.setAttribute(
      "aria-label",
      "Send message"
    );


    sendIcon.innerHTML = `
      <path d="M22 2 11 13"/>

      <path
        d="
          m22 2-7 20
          -4-9
          -9-4
          20-7z
        "
      />
    `;
  }


  /* =========================================================
     INPUT
  ========================================================= */

  function resizeInput() {

    userInput.style.height =
      "auto";


    userInput.style.height =
      Math.min(
        userInput.scrollHeight,
        180
      ) + "px";
  }


  userInput.addEventListener(
    "input",
    () => {

      resizeInput();
      updateSendButton();
    }
  );


  userInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
          "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();


        if (
          !isGenerating
        ) {

          sendMessage();
        }
      }
    }
  );


  /* =========================================================
     WEB SEARCH
  ========================================================= */

  webSearchBtn.addEventListener(
    "click",
    () => {

      webSearchEnabled =
        !webSearchEnabled;


      webSearchBtn.classList.toggle(
        "active",
        webSearchEnabled
      );


      searchStatus.classList.toggle(
        "active",
        webSearchEnabled
      );


      searchStatus.textContent =
        webSearchEnabled
          ? "Web search on"
          : "Web search off";
    }
  );


  /* =========================================================
     NEW CHAT
  ========================================================= */

  newChatBtn.addEventListener(
    "click",
    async () => {

      if (
        isGenerating
      ) {

        stopGeneration();
      }


      const chat =
        await createChat(
          "New chat"
        );


      if (chat) {

        userInput.focus();
      }
    }
  );


  /* =========================================================
     SIGN OUT
  ========================================================= */

  signOutBtn.addEventListener(
    "click",
    async () => {

      if (
        isGenerating
      ) {

        stopGeneration();
      }


      const {
        error
      } =
        await supabaseClient.auth
          .signOut();


      if (error) {

        console.error(
          "Sign out error:",
          error
        );


        showToast(
          error.message ||
            "Could not sign out."
        );


        return;
      }


      window.location.replace(
        LOGIN_PAGE
      );
    }
  );


  /* =========================================================
     INITIALIZE
  ========================================================= */

  async function initialize() {

    if (
      !isConfigured()
    ) {

      showToast(
        "Supabase or Worker configuration is missing."
      );


      return;
    }


    const authenticated =
      await initializeAuth();


    if (!authenticated) {
      return;
    }


    renderUser();


    const chats =
      await loadChats();


    const savedChatId =
      localStorage.getItem(
        CHAT_STORAGE_KEY
      );


    let chatToOpen =
      null;


    if (
      savedChatId &&
      chats.some(
        chat =>
          chat.id ===
          savedChatId
      )
    ) {

      chatToOpen =
        savedChatId;

    } else if (
      chats.length > 0
    ) {

      chatToOpen =
        chats[0].id;
    }


    if (
      chatToOpen
    ) {

      await openChat(
        chatToOpen
      );

    } else {

      currentChat =
        null;

      messageRecords =
        [];


      updateCurrentTab();

      renderMessages();
    }


    updateSendButton();

    resizeInput();

    userInput.focus();
  }


  initialize();
</script>

</body>
</html>
