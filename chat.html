<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI</title>
  <meta name="description" content="Free AI chat powered by OpenRouter.">
  <meta name="theme-color" content="#17181b">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png"> <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="manifest" href="site.webmanifest">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>

  <style>
    :root {
      --bg: #1a1b1e;
      --sidebar: #17181b;
      --sidebar-hover: #212226;
      --surface: #1a1b1e;
      --surface-hover: #232427;
      --input: #202124;
      --elevated: #1f2023;

      --text: #e9e9ec;
      --text-secondary: #a3a3ab;
      --text-muted: #6c6d74;

      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.13);

      --accent: #6c8eff;
      --accent-hover: #5a7cf0;
      --accent-soft: rgba(108, 142, 255, 0.14);
      --accent-text: #a9bcff;

      --success: #4caf7d;
      --danger: #e5534b;
      --danger-soft: rgba(229, 83, 75, 0.13);
      --warning: #d9a441;

      --user-message: #2a2c31;
      --code-bg: #131417;
      --code-header: #17181b;

      --radius-sm: 5px;
      --radius-md: 8px;
      --radius-lg: 11px;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.28);

      --ease: cubic-bezier(0.2, 0, 0, 1);
      --fast: 0.12s;
      --normal: 0.18s;

      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    [data-theme="light"] {
      --bg: #fbfbfa;
      --sidebar: #f3f3f2;
      --sidebar-hover: #e9e9e7;
      --surface: #fbfbfa;
      --surface-hover: #eeeeec;
      --input: #f0f0ee;
      --elevated: #ffffff;

      --text: #1c1c1f;
      --text-secondary: #5c5c63;
      --text-muted: #8a8a90;

      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.14);

      --accent: #4b6fe0;
      --accent-hover: #3d5dc9;
      --accent-soft: rgba(75, 111, 224, 0.10);
      --accent-text: #3d5dc9;

      --success: #2f8f5e;
      --danger: #d33b33;
      --danger-soft: rgba(211, 59, 51, 0.09);
      --warning: #b3791f;

      --user-message: #eceef2;
      --code-bg: #f4f4f3;
      --code-header: #ebebe9;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }

    body {
      overflow: hidden;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, input { font: inherit; color: inherit; }
    button { border: 0; background: none; }
    ::selection { background: var(--accent-soft); }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    .app { width: 100%; height: 100vh; display: flex; background: var(--bg); }

    .sidebar {
      width: 264px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
    }

    .sidebar-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13.5px;
      font-weight: 650;
      letter-spacing: -0.1px;
    }

    .brand-mark {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .new-chat-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
    }
    .new-chat-btn:hover { background: var(--sidebar-hover); color: var(--text); }
    .new-chat-btn svg { width: 17px; height: 17px; }

    .sidebar-search {
      flex-shrink: 0;
      margin: 2px 12px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border-radius: var(--radius-sm);
      background: var(--input);
      border: 1px solid transparent;
      transition: border-color var(--fast) var(--ease);
    }
    .sidebar-search:focus-within { border-color: var(--border-strong); }
    .sidebar-search svg {
      width: 14px; height: 14px; flex-shrink: 0; color: var(--text-muted);
    }
    .sidebar-search input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 12.5px;
      color: var(--text);
    }
    .sidebar-search input::placeholder { color: var(--text-muted); }

    .chats-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 8px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .chats-list::-webkit-scrollbar { width: 6px; }
    .chats-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

    .chat-group-label {
      padding: 12px 9px 5px;
      font-size: 10.5px;
      font-weight: 650;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .chat-group-label:first-child { padding-top: 6px; }

    .chat-item {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 6px 7px 11px;
      margin-bottom: 1px;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
    }
    .chat-item:hover { background: var(--sidebar-hover); color: var(--text); }
    .chat-item.active {
      background: var(--accent-soft);
      color: var(--text);
    }
    .chat-item.active::before {
      content: "";
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 2px;
      border-radius: 2px;
      background: var(--accent);
    }

    .chat-item-title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12.5px;
      line-height: 1.4;
    }

    .chat-item-actions {
      display: flex;
      align-items: center;
      gap: 1px;
      opacity: 0;
      transition: opacity var(--fast) var(--ease);
    }
    .chat-item:hover .chat-item-actions,
    .chat-item.active .chat-item-actions { opacity: 1; }

    .chat-item-action {
      width: 23px;
      height: 23px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .chat-item-action:hover { background: var(--surface-hover); color: var(--text); }
    .chat-item-action.delete:hover { background: var(--danger-soft); color: var(--danger); }
    .chat-item-action svg { width: 12.5px; height: 12.5px; }

    .chats-empty {
      padding: 18px 9px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .user-panel { flex-shrink: 0; padding: 9px; border-top: 1px solid var(--border); }

    .user-info { display: flex; align-items: center; gap: 9px; padding: 6px 5px; border-radius: var(--radius-sm); }

    .avatar {
      width: 30px; height: 30px; flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-hover);
      border: 1px solid var(--border);
    }

    .user-details { min-width: 0; flex: 1; }
    .user-name, .user-email { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .user-name { font-size: 12px; font-weight: 600; }
    .user-email { margin-top: 1px; color: var(--text-muted); font-size: 10.5px; }

    .signout-btn {
      width: 100%;
      margin-top: 3px;
      padding: 7px 7px;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      text-align: left;
      font-size: 11.5px;
      cursor: pointer;
      transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
    }
    .signout-btn:hover { background: var(--danger-soft); color: var(--danger); }
    .signout-btn svg { width: 13px; height: 13px; }

    .chat { min-width: 0; flex: 1; display: flex; flex-direction: column; background: var(--surface); }

    .chat-header {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
    }

    .current-tab {
      max-width: min(70%, 640px);
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 3px 4px 3px 10px;
      border-radius: var(--radius-sm);
    }

    .current-tab-title {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 12.5px;
      font-weight: 600;
    }

    .current-tab-model {
      margin-left: 8px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--input);
      color: var(--text-muted);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .current-tab-search {
      margin-left: 5px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 9.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .current-tab-search svg { width: 9px; height: 9px; }

    .close-tab-btn {
      width: 25px; height: 25px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: 5px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .close-tab-btn:hover { background: var(--danger-soft); color: var(--danger); }
    .close-tab-btn svg { width: 13px; height: 13px; }

    .header-actions { display: flex; align-items: center; gap: 3px; }

    .icon-btn {
      width: 32px; height: 32px;
      display: grid; place-items: center;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
    }
    .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
    .icon-btn svg { width: 17px; height: 17px; }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 0 28px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .messages::-webkit-scrollbar { width: 8px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

    .empty-state {
      max-width: 560px;
      margin: 9vh auto 0;
      padding: 0 20px;
    }

    .empty-state h1 {
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .empty-state p {
      color: var(--text-secondary);
      font-size: 13.5px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .suggestion-chip {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--elevated);
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.4;
      cursor: pointer;
      transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease), color var(--fast) var(--ease);
    }
    .suggestion-chip:hover {
      border-color: var(--border-strong);
      background: var(--surface-hover);
      color: var(--text);
    }
    .suggestion-chip svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; color: var(--text-muted); }

    .message-row {
      position: relative;
      width: 100%;
      padding: 3px 24px;
      animation: messageIn var(--normal) var(--ease);
    }

    .message-container { max-width: 780px; margin: 0 auto; padding: 7px 0; }

    .message { min-width: 0; }

    .message.user { display: flex; justify-content: flex-end; }

    .message.user .message-content {
      width: fit-content;
      max-width: 80%;
      padding: 9px 13px;
      border-radius: var(--radius-md) var(--radius-md) 3px var(--radius-md);
      background: var(--user-message);
      color: var(--text);
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 14px;
    }

    .message.ai .message-content {
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }

    .role-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 11px;
      font-weight: 650;
      color: var(--text-muted);
    }
    .role-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* =====================================================
       MESSAGE TOOLBAR — restyled
       Pill-shaped icon buttons on a soft floating surface.
       User bubbles now only get Copy + Retry (no Delete).
    ===================================================== */

    .message.user .message-toolbar { justify-content: flex-end; }

    .message-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      padding: 3px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease);
    }
    .message-row:hover .message-toolbar,
    .message-row:focus-within .message-toolbar {
      opacity: 1;
      transform: translateY(0);
    }

    .message-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      background: var(--elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 10.5px;
      font-weight: 550;
      transition: background var(--fast) var(--ease), color var(--fast) var(--ease),
                  border-color var(--fast) var(--ease), transform var(--fast) var(--ease);
    }
    .message-action span { display: none; }
    .message-action:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }
    .message-action:active { transform: translateY(0); }
    .message-action.delete:hover { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
    .message-action.retry:hover { background: rgba(217, 164, 65, 0.13); color: var(--warning); border-color: transparent; }
    .message-action.copy:hover { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
    .message-action svg { width: 13.5px; height: 13.5px; }

    .message-content p { margin-bottom: 12px; }
    .message-content p:last-child { margin-bottom: 0; }

    .message-content h1, .message-content h2, .message-content h3, .message-content h4 {
      margin: 20px 0 8px;
      line-height: 1.35;
      font-weight: 650;
      letter-spacing: -0.2px;
    }
    .message-content h1:first-child, .message-content h2:first-child, .message-content h3:first-child { margin-top: 2px; }
    .message-content h1 { font-size: 21px; }
    .message-content h2 { font-size: 18px; }
    .message-content h3 { font-size: 15.5px; }

    .message-content ul, .message-content ol { margin: 8px 0 14px; padding-left: 21px; }
    .message-content li { margin: 4px 0; }
    .message-content li > p { margin-bottom: 4px; }

    .message-content hr {
      margin: 18px 0;
      border: 0;
      border-top: 1px solid var(--border);
    }

    .message-content blockquote {
      margin: 12px 0;
      padding: 8px 13px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      color: var(--text-secondary);
      border-radius: 0 5px 5px 0;
    }
    .message-content blockquote p:last-child { margin-bottom: 0; }

    .message-content a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
    .message-content a:hover { text-decoration-thickness: 2px; }

    .message-content table {
      margin: 14px 0;
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .message-content th, .message-content td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .message-content th {
      background: var(--elevated);
      font-weight: 650;
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .message-content tr:last-child td { border-bottom: 0; }

    .message-content code:not(pre code) {
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-family: var(--font-mono);
      font-size: 0.87em;
    }

    .code-wrapper {
      margin: 14px 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--code-bg);
    }

    .code-header {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: var(--code-header);
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.2px;
    }

    .code-copy {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 10.5px;
      transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
    }
    .code-copy:hover { background: var(--surface-hover); color: var(--text); }

    .message-content pre {
      margin: 0;
      padding: 13px 14px;
      overflow-x: auto;
      background: var(--code-bg);
      color: #e6edf3;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.6;
      scrollbar-width: thin;
    }
    [data-theme="light"] .message-content pre { color: #24292f; }

    .typing { display: inline-flex; align-items: center; gap: 4px; padding: 6px 0; }
    .typing-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--text-muted);
      animation: typing 1.15s infinite var(--ease);
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.30s; }

    .sources {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--text-muted); font-size: 10px;
    }
    .source-link {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
    }
    .source-link:hover { background: var(--surface-hover); color: var(--text); }

    .scroll-bottom-btn {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translate(-50%, 8px);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--elevated);
      color: var(--text-secondary);
      font-size: 11px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--normal) var(--ease), transform var(--normal) var(--ease);
    }
    .scroll-bottom-btn.visible { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .scroll-bottom-btn svg { width: 12px; height: 12px; }

    .composer-wrap {
      position: relative;
      flex-shrink: 0;
      padding: 8px 16px 14px;
      background: var(--surface);
    }

    .composer {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 7px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background: var(--input);
      box-shadow: var(--shadow-sm);
      transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .web-search-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 36px;
      flex-shrink: 0;
      padding: 0 10px;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 550;
      white-space: nowrap;
      transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
    }
    .web-search-btn:hover { background: var(--surface-hover); color: var(--text); }
    .web-search-btn.active { background: var(--accent-soft); color: var(--accent-text); }
    .web-search-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .web-search-btn span { display: none; }
    @media (min-width: 640px) { .web-search-btn span { display: inline; } }

    .composer textarea {
      flex: 1;
      min-height: 36px;
      max-height: 200px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 8px 3px;
      font-size: 14px;
      line-height: 1.5;
    }
    .composer textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 36px; height: 36px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background var(--fast) var(--ease), opacity var(--fast) var(--ease);
    }
    .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .send-btn.stop { background: var(--danger); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; }

    .composer-footer {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 4px 0;
      color: var(--text-muted);
      font-size: 10.5px;
    }
    .composer-hint kbd {
      padding: 1px 5px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 9.5px;
    }
    .search-status.active { color: var(--accent-text); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      transform: translate(-50%, 10px);
      padding: 9px 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--elevated);
      color: var(--text);
      font-size: 12px;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--normal) var(--ease), transform var(--normal) var(--ease);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .mobile-nav-btn { display: none; }

    .sidebar-backdrop {
      display: none;
    }

    @media (max-width: 900px) {
      .sidebar { width: 232px; }
      .empty-state { margin-top: 6vh; }
      .suggestion-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .app { position: relative; overflow: hidden; }

      .sidebar {
        position: absolute;
        z-index: 20;
        top: 0; left: 0; bottom: 0;
        width: 78%;
        max-width: 300px;
        transform: translateX(-100%);
        transition: transform var(--normal) var(--ease);
        box-shadow: var(--shadow-md);
      }
      .sidebar.open { transform: translateX(0); }

      .sidebar-backdrop {
        display: block;
        position: absolute;
        inset: 0;
        z-index: 19;
        background: rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--normal) var(--ease);
      }
      .sidebar-backdrop.visible { opacity: 1; pointer-events: auto; }

      .mobile-nav-btn {
        display: grid;
        place-items: center;
        width: 32px; height: 32px;
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
        cursor: pointer;
        margin-right: 2px;
      }
      .mobile-nav-btn:hover { background: var(--surface-hover); }
      .mobile-nav-btn svg { width: 18px; height: 18px; }

      .message-row { padding-left: 14px; padding-right: 14px; }
      .message-toolbar { opacity: 1; transform: translateY(0); }
      .current-tab-model { display: none; }
    }

    @media (max-width: 480px) {
      .message.user .message-content { max-width: 90%; }
      .composer-wrap { padding: 7px 8px 10px; }
      .empty-state { margin-top: 4vh; }
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes typing {
      0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }
  </style>
</head>

<body>

<div class="app">

  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

  <aside id="sidebar" class="sidebar">

    <header class="sidebar-header">
      <div class="brand">
        <span class="brand-mark">F</span>
        Free AI
      </div>

      <button id="newChatBtn" class="new-chat-btn" type="button" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14"/>
          <path d="M5 12h14"/>
        </svg>
      </button>
    </header>

    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-4-4"/>
      </svg>
      <input id="chatSearchInput" type="text" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
    </div>

    <div id="chatsList" class="chats-list"></div>

    <footer class="user-panel">
      <div class="user-info">
        <img id="userAvatar" class="avatar" src="" alt="">
        <div class="user-details">
          <div id="userName" class="user-name">Loading...</div>
          <div id="userEmail" class="user-email"></div>
        </div>
      </div>

      <button id="signOutBtn" class="signout-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="m16 17 5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
        Sign out
      </button>
    </footer>

  </aside>


  <main class="chat">

    <header class="chat-header">
      <div style="display:flex; align-items:center; min-width:0;">
        <button id="mobileNavBtn" class="mobile-nav-btn" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16"/>
            <path d="M4 12h16"/>
            <path d="M4 18h16"/>
          </svg>
        </button>

        <div id="currentTab" class="current-tab" hidden>
          <span id="currentTabTitle" class="current-tab-title">New chat</span>
          <span class="current-tab-model">OpenRouter</span>
          <span id="currentTabSearch" class="current-tab-search" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-4-4"/>
            </svg>
            Web
          </span>
        </div>
      </div>

      <div class="header-actions">
        <button id="themeBtn" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42 M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2 M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <section id="messages" class="messages"></section>

    <div class="composer-wrap">

      <button id="scrollBottomBtn" class="scroll-bottom-btn" type="button" aria-label="Scroll to latest message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14"/>
          <path d="m19 12-7 7-7-7"/>
        </svg>
        New messages
      </button>

      <div class="composer">
        <button id="webSearchBtn" class="web-search-btn" type="button" title="Toggle web search" aria-label="Toggle web search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </svg>
          <span>Search</span>
        </button>

        <textarea
          id="userInput"
          rows="1"
          placeholder="Message Free AI..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>

        <button id="sendBtn" class="send-btn" type="button" disabled title="Send message" aria-label="Send message">
          <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2 11 13"/>
            <path d="m22 2-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>

      <div class="composer-footer">
        <span class="composer-hint"><kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift</kbd>+<kbd>Enter</kbd> for new line</span>
        <span id="searchStatus" class="search-status">Web search off</span>
      </div>

    </div>

  </main>

</div>

<div id="toast" class="toast"></div>

<script>

  const SUPABASE_URL = "https://houpacapqrrvfqzzrlxs.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_YlFSX-js_1YUsqGxc4BeHQ_bhmlE5Le";
  const WORKER_URL = "https://api.ai09.workers.dev/";
  const LOGIN_PAGE = "./index.html";
  const CHAT_STORAGE_KEY = "free-ai-current-chat";
  const THEME_KEY = "free-ai-theme";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });

  const chatsList = document.getElementById("chatsList");
  const chatSearchInput = document.getElementById("chatSearchInput");
  const newChatBtn = document.getElementById("newChatBtn");
  const signOutBtn = document.getElementById("signOutBtn");
  const userAvatar = document.getElementById("userAvatar");
  const userName = document.getElementById("userName");
  const userEmail = document.getElementById("userEmail");
  const currentTab = document.getElementById("currentTab");
  const currentTabTitle = document.getElementById("currentTabTitle");
  const currentTabSearch = document.getElementById("currentTabSearch");
  const messagesEl = document.getElementById("messages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const sendIcon = document.getElementById("sendIcon");
  const webSearchBtn = document.getElementById("webSearchBtn");
  const searchStatus = document.getElementById("searchStatus");
  const themeBtn = document.getElementById("themeBtn");
  const themeIcon = document.getElementById("themeIcon");
  const toastEl = document.getElementById("toast");
  const sidebarEl = document.getElementById("sidebar");
  const sidebarBackdrop = document.getElementById("sidebarBackdrop");
  const mobileNavBtn = document.getElementById("mobileNavBtn");
  const scrollBottomBtn = document.getElementById("scrollBottomBtn");

  let currentUser = null;
  let currentSession = null;
  let currentChat = null;
  let messageRecords = [];
  let isGenerating = false;
  let controller = null;
  let webSearchEnabled = false;
  let toastTimer = null;
  let allChats = [];
  let chatSearchQuery = "";
  let userNearBottom = true;

  function isConfigured() {
    return (
      SUPABASE_URL && SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("YOUR_") &&
      SUPABASE_PUBLISHABLE_KEY && !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_") &&
      WORKER_URL && WORKER_URL.startsWith("https://") && !WORKER_URL.includes("YOUR_")
    );
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.classList.remove("show"); }, 2500);
  }

  function loadTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) { document.documentElement.dataset.theme = saved; }
  }

  function updateThemeIcon() {
    const dark = document.documentElement.dataset.theme === "dark";
    if (dark) {
      themeIcon.innerHTML = `
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42 M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2 M4.93 19.07l1.42-1.42 M17.65 6.35l1.42-1.42"/>
      `;
    } else {
      themeIcon.innerHTML = `<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3A6.7 6.7 0 0 0 21 12.8z"/>`;
    }
  }

  themeBtn.addEventListener("click", () => {
    const current = document.documentElement.dataset.theme;
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem(THEME_KEY, next);
    updateThemeIcon();
  });

  loadTheme();
  updateThemeIcon();

  function openSidebar() {
    sidebarEl.classList.add("open");
    sidebarBackdrop.classList.add("visible");
  }

  function closeSidebar() {
    sidebarEl.classList.remove("open");
    sidebarBackdrop.classList.remove("visible");
  }

  mobileNavBtn.addEventListener("click", () => {
    sidebarEl.classList.contains("open") ? closeSidebar() : openSidebar();
  });

  sidebarBackdrop.addEventListener("click", closeSidebar);

  async function ensureFreshSession() {
    const { data, error } = await supabaseClient.auth.refreshSession();

    if (error || !data?.session) {
      console.error("Session refresh failed:", error);
      await supabaseClient.auth.signOut();
      window.location.replace(LOGIN_PAGE);
      return null;
    }

    currentSession = data.session;
    currentUser = data.session.user;

    return data.session;
  }

  async function initializeAuth() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data?.session) {
      window.location.replace(LOGIN_PAGE);
      return false;
    }

    currentSession = data.session;
    currentUser = data.session.user;

    const refreshed = await ensureFreshSession();

    return Boolean(refreshed);
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    currentSession = session;
    currentUser = session?.user || null;

    if (!session) {
      window.location.replace(LOGIN_PAGE);
    }
  });

  function fallbackAvatar(name) {
    const letter = (name || "U").trim().charAt(0).toUpperCase() || "U";

    return (
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
          <rect width="64" height="64" fill="#6c8eff"/>
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="28" font-family="Arial" font-weight="bold">${letter}</text>
        </svg>
      `)
    );
  }

  function renderUser() {
    if (!currentUser) { return; }

    const metadata = currentUser.user_metadata || {};
    const name = metadata.full_name || metadata.name || currentUser.email || "User";

    userName.textContent = name;
    userEmail.textContent = currentUser.email || "";
    userAvatar.src = metadata.avatar_url || fallbackAvatar(name);
  }

  function updateCurrentTab() {
    if (!currentChat) {
      currentTab.hidden = true;
      return;
    }

    currentTab.hidden = false;
    currentTabTitle.textContent = currentChat.title || "New chat";
  }

  function makeChatTitle(text) {
    const clean = text.replace(/\s+/g, " ").trim();

    if (!clean) { return "New chat"; }
    if (clean.length <= 42) { return clean; }

    return clean.slice(0, 39) + "...";
  }

  function dateGroupLabel(isoString) {
    const then = new Date(isoString);
    const now = new Date();

    const startOfDay = date => new Date(date.getFullYear(), date.getMonth(), date.getDate());

    const diffDays = Math.round((startOfDay(now) - startOfDay(then)) / 86400000);

    if (diffDays <= 0) { return "Today"; }
    if (diffDays === 1) { return "Yesterday"; }
    if (diffDays <= 7) { return "Previous 7 days"; }
    if (diffDays <= 30) { return "Previous 30 days"; }

    return "Older";
  }

  function renderChatsList() {

    chatsList.innerHTML = "";

    const query = chatSearchQuery.trim().toLowerCase();

    const filtered = query
      ? allChats.filter(chat => (chat.title || "New chat").toLowerCase().includes(query))
      : allChats;

    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "chats-empty";
      empty.textContent = query ? "No chats match your search." : "No conversations yet.";
      chatsList.appendChild(empty);
      return;
    }

    let lastGroup = null;

    for (const chat of filtered) {

      const group = dateGroupLabel(chat.updated_at || chat.created_at);

      if (group !== lastGroup) {
        const label = document.createElement("div");
        label.className = "chat-group-label";
        label.textContent = group;
        chatsList.appendChild(label);
        lastGroup = group;
      }

      const item = document.createElement("div");
      item.className = "chat-item";

      if (currentChat && currentChat.id === chat.id) {
        item.classList.add("active");
      }

      const title = document.createElement("span");
      title.className = "chat-item-title";
      title.textContent = chat.title || "New chat";

      const actions = document.createElement("div");
      actions.className = "chat-item-actions";

      const closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "chat-item-action";
      closeBtn.title = "Close tab";
      closeBtn.setAttribute("aria-label", "Close tab");
      closeBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l12 12"/>
          <path d="M18 6L6 18"/>
        </svg>
      `;

      closeBtn.addEventListener("click", event => {
        event.stopPropagation();

        if (currentChat && currentChat.id === chat.id) {
          if (isGenerating) { stopGeneration(); }

          currentChat = null;
          messageRecords = [];

          localStorage.removeItem(CHAT_STORAGE_KEY);

          updateCurrentTab();
          renderMessages();
          renderChatsList();
          userInput.focus();
        }
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "chat-item-action delete";
      deleteBtn.title = "Delete chat";
      deleteBtn.setAttribute("aria-label", "Delete chat");
      deleteBtn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18"/>
          <path d="M8 6V4h8v2"/>
          <path d="M19 6l-1 15H6L5 6"/>
          <path d="M10 11v6"/>
          <path d="M14 11v6"/>
        </svg>
      `;

      deleteBtn.addEventListener("click", async event => {
        event.stopPropagation();
        await deleteChat(chat.id);
      });

      actions.appendChild(closeBtn);
      actions.appendChild(deleteBtn);

      item.appendChild(title);
      item.appendChild(actions);

      item.addEventListener("click", () => {
        openChat(chat.id);
        closeSidebar();
      });

      chatsList.appendChild(item);
    }
  }

  chatSearchInput.addEventListener("input", () => {
    chatSearchQuery = chatSearchInput.value;
    renderChatsList();
  });

  async function loadChats() {

    const { data, error } = await supabaseClient
      .from("chats")
      .select("id,user_id,title,created_at,updated_at")
      .order("updated_at", { ascending: false });

    if (error) {
      console.error("loadChats:", error);
      showToast(error.message || "Could not load chats.");
      return [];
    }

    allChats = data || [];
    renderChatsList();

    return allChats;
  }

  async function createChat(title = "New chat") {

    if (!currentUser) { return null; }

    const { data, error } = await supabaseClient
      .from("chats")
      .insert({ user_id: currentUser.id, title })
      .select()
      .single();

    if (error) {
      console.error("createChat:", error);
      showToast(error.message || "Could not create chat.");
      return null;
    }

    currentChat = data;
    messageRecords = [];

    localStorage.setItem(CHAT_STORAGE_KEY, data.id);

    updateCurrentTab();
    renderMessages();
    await loadChats();

    return data;
  }

  async function updateChatTitle(title) {

    if (!currentChat) { return; }

    const { data, error } = await supabaseClient
      .from("chats")
      .update({ title, updated_at: new Date().toISOString() })
      .eq("id", currentChat.id)
      .select()
      .single();

    if (error) {
      console.error("updateChatTitle:", error);
      return;
    }

    currentChat = data;
    updateCurrentTab();
  }

  async function deleteChat(chatId) {

    const confirmed = window.confirm("Delete this entire conversation?");

    if (!confirmed) { return; }

    const { error } = await supabaseClient.from("chats").delete().eq("id", chatId);

    if (error) {
      console.error("deleteChat:", error);
      showToast(error.message || "Could not delete chat.");
      return;
    }

    if (currentChat && currentChat.id === chatId) {
      stopGeneration();

      currentChat = null;
      messageRecords = [];

      localStorage.removeItem(CHAT_STORAGE_KEY);

      updateCurrentTab();
      renderMessages();
    }

    await loadChats();
  }

  async function openChat(chatId) {

    if (isGenerating) { stopGeneration(); }

    const { data: chat, error: chatError } = await supabaseClient
      .from("chats")
      .select("*")
      .eq("id", chatId)
      .single();

    if (chatError) {
      console.error("openChat:", chatError);
      showToast(chatError.message || "Could not open chat.");
      return;
    }

    const { data: messages, error: messageError } = await supabaseClient
      .from("messages")
      .select("id,chat_id,role,content,created_at")
      .eq("chat_id", chatId)
      .order("created_at", { ascending: true });

    if (messageError) {
      console.error("openChat messages:", messageError);
      showToast(messageError.message || "Could not load messages.");
      return;
    }

    currentChat = chat;
    messageRecords = messages || [];

    localStorage.setItem(CHAT_STORAGE_KEY, chat.id);

    updateCurrentTab();
    renderMessages();
    await loadChats();
  }

  async function saveMessage(role, content) {

    if (!currentChat) { return null; }

    const { data, error } = await supabaseClient
      .from("messages")
      .insert({ chat_id: currentChat.id, role, content })
      .select()
      .single();

    if (error) {
      console.error("saveMessage:", error);
      throw new Error(error.message || "Could not save message.");
    }

    messageRecords.push(data);

    return data;
  }

  async function touchChat() {

    if (!currentChat) { return; }

    const { data, error } = await supabaseClient
      .from("chats")
      .update({ updated_at: new Date().toISOString() })
      .eq("id", currentChat.id)
      .select()
      .single();

    if (!error && data) {
      currentChat = data;
      updateCurrentTab();
    }
  }

  async function deleteMessage(messageId) {

    const confirmed = window.confirm("Delete this message?");

    if (!confirmed) { return; }

    const { error } = await supabaseClient
      .from("messages")
      .delete()
      .eq("id", messageId)
      .eq("chat_id", currentChat.id);

    if (error) {
      console.error("deleteMessage:", error);
      showToast(error.message || "Could not delete message.");
      return;
    }

    messageRecords = messageRecords.filter(message => message.id !== messageId);

    renderMessages();

    await touchChat();
    await loadChats();

    showToast("Message deleted.");
  }

  marked.setOptions({ breaks: true, gfm: true });

  function renderMarkdown(text) {
    const html = marked.parse(text || "");
    return DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
  }

  function enhanceCodeBlocks(container) {

    container.querySelectorAll("pre").forEach(pre => {

      if (pre.parentElement && pre.parentElement.classList.contains("code-wrapper")) {
        return;
      }

      const code = pre.querySelector("code");
      if (!code) { return; }

      const wrapper = document.createElement("div");
      wrapper.className = "code-wrapper";

      const header = document.createElement("div");
      header.className = "code-header";

      const language = document.createElement("span");

      const languageClass = Array.from(code.classList).find(value => value.startsWith("language-"));
      language.textContent = languageClass ? languageClass.replace("language-", "") : "code";

      const copy = document.createElement("button");
      copy.type = "button";
      copy.className = "code-copy";
      copy.textContent = "Copy";

      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code.textContent);
          copy.textContent = "Copied";
          setTimeout(() => { copy.textContent = "Copy"; }, 1200);
        } catch {
          showToast("Could not copy code.");
        }
      });

      header.appendChild(language);
      header.appendChild(copy);

      pre.parentNode.insertBefore(wrapper, pre);

      wrapper.appendChild(header);
      wrapper.appendChild(pre);
    });
  }

  const ICONS = {

    copy: `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="11" height="11" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    `,

    retry: `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 11a8.1 8.1 0 0 0-15.5-3"/>
        <path d="M4 4v5h5"/>
        <path d="M4 13a8.1 8.1 0 0 0 15.5 3"/>
        <path d="M20 20v-5h-5"/>
      </svg>
    `,

    delete: `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18"/>
        <path d="M8 6V4h8v2"/>
        <path d="M19 6l-1 15H6L5 6"/>
        <path d="M10 11v6"/>
        <path d="M14 11v6"/>
      </svg>
    `
  };

  function createMessageAction(label, type, callback) {

    const button = document.createElement("button");
    button.type = "button";
    button.className = "message-action " + type;
    button.title = label;
    button.setAttribute("aria-label", label);
    button.innerHTML = ICONS[type] + `<span>${label}</span>`;

    button.addEventListener("click", event => {
      event.stopPropagation();
      callback();
    });

    return button;
  }

  async function copyMessage(content) {
    try {
      await navigator.clipboard.writeText(content);
      showToast("Message copied.");
    } catch {
      showToast("Could not copy message.");
    }
  }

  /* =========================================================
     RENDER MESSAGE
     User bubbles: Copy + Retry only (no Delete).
     Assistant bubbles: Copy + Retry + Delete.
  ========================================================= */

  function renderMessage(record, index) {

    const row = document.createElement("div");
    row.className = "message-row";
    row.dataset.messageId = record.id;

    const container = document.createElement("div");
    container.className = "message-container";

    const message = document.createElement("article");
    message.className = record.role === "user" ? "message user" : "message ai";

    if (record.role !== "user") {
      const roleLabel = document.createElement("div");
      roleLabel.className = "role-label";
      roleLabel.innerHTML = `<span class="role-dot"></span>Assistant`;
      message.appendChild(roleLabel);
    }

    const content = document.createElement("div");
    content.className = "message-content";

    if (record.role === "user") {
      content.textContent = record.content;
    } else {
      content.innerHTML = renderMarkdown(record.content);
      enhanceCodeBlocks(content);
    }

    message.appendChild(content);

    const toolbar = document.createElement("div");
    toolbar.className = "message-toolbar";

    toolbar.appendChild(createMessageAction("Copy", "copy", () => copyMessage(record.content)));
    toolbar.appendChild(createMessageAction("Retry", "retry", () => retryMessage(index)));

    if (record.role !== "user") {
      toolbar.appendChild(createMessageAction("Delete", "delete", () => deleteMessage(record.id)));
    }

    message.appendChild(toolbar);
    container.appendChild(message);
    row.appendChild(container);

    return row;
  }

  const SUGGESTIONS = [
    { text: "Explain a programming concept to me", icon: `<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>` },
    { text: "Review my code for bugs and style issues", icon: `<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>` },
    { text: "Search the web for something", icon: `<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>` },
    { text: "Help me plan a project", icon: `<path d="M9 11H3v9h6z"/><path d="M21 5h-6v15h6z"/><path d="M15 3H9v18h6z"/>` }
  ];

  function renderEmptyState() {

    const empty = document.createElement("div");
    empty.className = "empty-state";

    const heading = document.createElement("h1");
    heading.textContent = "What are you working on?";

    const sub = document.createElement("p");
    sub.textContent = "Ask a question, explain a problem, or start building something.";

    const grid = document.createElement("div");
    grid.className = "suggestion-grid";

    SUGGESTIONS.forEach(suggestion => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "suggestion-chip";
      chip.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${suggestion.icon}</svg>
        <span>${suggestion.text}</span>
      `;

      chip.addEventListener("click", () => {
        userInput.value = suggestion.text;
        resizeInput();
        updateSendButton();
        userInput.focus();
      });

      grid.appendChild(chip);
    });

    empty.appendChild(heading);
    empty.appendChild(sub);
    empty.appendChild(grid);

    return empty;
  }

  function renderMessages() {

    messagesEl.innerHTML = "";

    if (messageRecords.length === 0) {
      messagesEl.appendChild(renderEmptyState());
      return;
    }

    messageRecords.forEach((record, index) => {
      messagesEl.appendChild(renderMessage(record, index));
    });

    userNearBottom = true;
    scrollToBottom(true);
  }

  function isNearBottom() {
    const threshold = 120;
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < threshold;
  }

  function scrollToBottom(force = false) {
    if (!force && !userNearBottom) { return; }

    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  messagesEl.addEventListener("scroll", () => {
    userNearBottom = isNearBottom();
    scrollBottomBtn.classList.toggle("visible", !userNearBottom && messageRecords.length > 0);
  });

  scrollBottomBtn.addEventListener("click", () => {
    userNearBottom = true;
    scrollToBottom(true);
    scrollBottomBtn.classList.remove("visible");
  });

  function resizeInput() {
    userInput.style.height = "auto";
    userInput.style.height = Math.min(userInput.scrollHeight, 200) + "px";
  }

  userInput.addEventListener("input", () => {
    resizeInput();
    updateSendButton();
  });

  function updateSendButton() {

    if (isGenerating) {
      sendBtn.disabled = false;
      sendBtn.classList.add("stop");
      sendBtn.title = "Stop generation";
      sendBtn.setAttribute("aria-label", "Stop generation");

      sendIcon.innerHTML = `<rect x="7" y="7" width="10" height="10" rx="2"/>`;

      return;
    }

    sendBtn.disabled = !userInput.value.trim();
    sendBtn.classList.remove("stop");
    sendBtn.title = "Send message";
    sendBtn.setAttribute("aria-label", "Send message");

    sendIcon.innerHTML = `
      <path d="M22 2 11 13"/>
      <path d="m22 2-7 20-4-9-9-4 20-7z"/>
    `;
  }

  webSearchBtn.addEventListener("click", () => {
    webSearchEnabled = !webSearchEnabled;

    webSearchBtn.classList.toggle("active", webSearchEnabled);
    searchStatus.classList.toggle("active", webSearchEnabled);
    currentTabSearch.hidden = !webSearchEnabled;

    searchStatus.textContent = webSearchEnabled ? "Web search on" : "Web search off";
  });

  newChatBtn.addEventListener("click", async () => {
    if (isGenerating) { stopGeneration(); }

    const chat = await createChat("New chat");

    if (chat) {
      closeSidebar();
      userInput.focus();
    }
  });

  async function retryMessage(index) {

    if (isGenerating) {
      showToast("Please wait for the current response.");
      return;
    }

    if (!currentChat) { return; }

    const selected = messageRecords[index];
    if (!selected) { return; }

    let userIndex = index;

    if (selected.role === "assistant") {
      for (let i = index - 1; i >= 0; i--) {
        if (messageRecords[i].role === "user") {
          userIndex = i;
          break;
        }
      }
    }

    const userMessage = messageRecords[userIndex];

    if (!userMessage || userMessage.role !== "user") {
      showToast("Could not find the user message to retry.");
      return;
    }

    const idsToDelete = messageRecords.slice(userIndex + 1).map(message => message.id);

    if (idsToDelete.length > 0) {
      const { error } = await supabaseClient
        .from("messages")
        .delete()
        .in("id", idsToDelete)
        .eq("chat_id", currentChat.id);

      if (error) {
        console.error("Retry cleanup:", error);
        showToast(error.message || "Could not prepare retry.");
        return;
      }
    }

    messageRecords = messageRecords.slice(0, userIndex + 1);

    renderMessages();

    await touchChat();

    await generateResponse();
  }

  function buildWorkerMessages() {

    return messageRecords
      .filter(message => message.role === "user" || message.role === "assistant")
      .map(message => ({ role: message.role, content: message.content }));
  }

  function createStreamingMessage() {

    const row = document.createElement("div");
    row.className = "message-row";

    const container = document.createElement("div");
    container.className = "message-container";

    const message = document.createElement("article");
    message.className = "message ai";

    const roleLabel = document.createElement("div");
    roleLabel.className = "role-label";
    roleLabel.innerHTML = `<span class="role-dot"></span>Assistant`;
    message.appendChild(roleLabel);

    const content = document.createElement("div");
    content.className = "message-content";

    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = `
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    `;

    content.appendChild(typing);
    message.appendChild(content);
    container.appendChild(message);
    row.appendChild(container);

    messagesEl.appendChild(row);

    scrollToBottom(true);

    return { row, content };
  }

  async function readStream(response, contentElement) {

    if (!response.body) {
      throw new Error("The Worker did not return a stream.");
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");

    let buffer = "";
    let answer = "";

    while (true) {

      const { value, done } = await reader.read();
      if (done) { break; }

      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const rawLine of lines) {

        const line = rawLine.trim();
        if (!line.startsWith("data:")) { continue; }

        const payload = line.slice(5).trim();
        if (payload === "[DONE]") { continue; }

        let parsed;

        try {
          parsed = JSON.parse(payload);
        } catch {
          continue;
        }

        const delta = parsed?.choices?.[0]?.delta?.content;
        if (typeof delta !== "string") { continue; }

        answer += delta;

        contentElement.innerHTML = renderMarkdown(answer);
        enhanceCodeBlocks(contentElement);

        scrollToBottom();
      }
    }

    return answer;
  }

  async function callWorker(session) {

    return fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session.access_token}`
      },
      signal: controller.signal,
      body: JSON.stringify({
        messages: buildWorkerMessages(),
        web_search: webSearchEnabled,
        temperature: 0.7,
        max_tokens: 4096,
        stream: true
      })
    });
  }

  async function generateResponse() {

    if (!currentChat) { return; }

    isGenerating = true;
    controller = new AbortController();

    updateSendButton();

    const streamMessage = createStreamingMessage();

    try {

      let session = await ensureFreshSession();
      if (!session) { return; }

      let response = await callWorker(session);

      if (response.status === 401) {
        showToast("Refreshing session...");

        session = await ensureFreshSession();
        if (!session) { return; }

        response = await callWorker(session);
      }

      if (!response.ok) {

        let errorMessage = `Request failed (${response.status}).`;

        try {
          const errorData = await response.json();

          if (typeof errorData.error === "string") {
            errorMessage = errorData.error;
          } else if (errorData?.error?.message) {
            errorMessage = errorData.error.message;
          }
        } catch {
          /* Ignore malformed error bodies. */
        }

        throw new Error(errorMessage);
      }

      const answer = await readStream(response, streamMessage.content);

      if (!answer.trim()) {
        throw new Error("The AI returned an empty response.");
      }

      streamMessage.row.remove();

      await saveMessage("assistant", answer);
      await touchChat();

      renderMessages();
      await loadChats();

    } catch (error) {

      streamMessage.row.remove();

      if (error.name === "AbortError") {
        showToast("Generation stopped.");
        return;
      }

      console.error("AI request failed:", error);
      showToast(error.message || "Something went wrong.");

    } finally {

      isGenerating = false;
      controller = null;

      updateSendButton();
      userInput.focus();
    }
  }

  async function sendMessage() {

    if (isGenerating) {
      stopGeneration();
      return;
    }

    const text = userInput.value.trim();
    if (!text) { return; }

    if (!isConfigured()) {
      showToast("Configure Supabase and the Worker URL first.");
      return;
    }

    if (!currentUser) {
      showToast("Please sign in again.");
      return;
    }

    if (!currentChat) {
      currentChat = await createChat(makeChatTitle(text));
      if (!currentChat) { return; }
    }

    if (currentChat.title === "New chat") {
      await updateChatTitle(makeChatTitle(text));
    }

    userInput.value = "";
    resizeInput();

    const userMessage = await saveMessage("user", text);

    if (!userMessage) {
      showToast("Could not save your message.");
      return;
    }

    await touchChat();

    userNearBottom = true;
    renderMessages();

    await generateResponse();
  }

  function stopGeneration() {

    if (controller) {
      controller.abort();
    }

    controller = null;
    isGenerating = false;

    updateSendButton();
    userInput.focus();
  }

  sendBtn.addEventListener("click", sendMessage);

  userInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      if (!isGenerating) { sendMessage(); }
    }
  });

  async function initialize() {

    if (!isConfigured()) {
      showToast("Set your Supabase and Worker configuration.");
      return;
    }

    const authenticated = await initializeAuth();
    if (!authenticated) { return; }

    renderUser();

    const chats = await loadChats();

    const savedChatId = localStorage.getItem(CHAT_STORAGE_KEY);

    let chatToOpen = null;

    if (savedChatId && chats.some(chat => chat.id === savedChatId)) {
      chatToOpen = savedChatId;
    } else if (chats.length > 0) {
      chatToOpen = chats[0].id;
    }

    if (chatToOpen) {
      await openChat(chatToOpen);
    } else {
      renderMessages();
    }

    updateCurrentTab();
    updateSendButton();
    resizeInput();

    userInput.focus();
  }

  initialize();

</script>
