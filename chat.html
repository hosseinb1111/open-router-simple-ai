<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Free AI</title>

  <meta
    name="description"
    content="Free AI chat powered by OpenRouter."
  >

  <meta
    name="theme-color"
    content="#2b2d31"
  >

  <link
    rel="icon"
    href="favicon.ico"
    type="image/x-icon"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>

  <style>
    :root {
      --bg: #313338;
      --sidebar: #2b2d31;
      --sidebar-hover: #35373c;

      --surface: #313338;
      --surface-hover: #3a3c43;
      --input: #383a40;

      --text: #f2f3f5;
      --text-secondary: #b5bac1;
      --text-muted: #949ba4;

      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.10);

      --accent: #5865f2;
      --accent-hover: #4752c4;

      --success: #23a559;
      --danger: #ed4245;
      --warning: #faa61a;
      --info: #00a8fc;

      --user-message: #404249;

      --code-bg: #1e1f22;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --sidebar: #f2f3f5;
      --sidebar-hover: #e3e5e8;

      --surface: #ffffff;
      --surface-hover: #e9eaec;
      --input: #ebedef;

      --text: #1e1f22;
      --text-secondary: #4f545c;
      --text-muted: #747f8d;

      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.13);

      --user-message: #e3e5e8;

      --code-bg: #1e1f22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    ::selection {
      background: rgba(88, 101, 242, 0.45);
    }

    /* =====================================================
       APP
    ===================================================== */

    .app {
      width: 100%;
      height: 100vh;

      display: flex;

      background: var(--bg);
    }

    /* =====================================================
       SIDEBAR
    ===================================================== */

    .sidebar {
      width: 270px;
      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: var(--sidebar);

      border-right:
        1px solid var(--border);
    }

    .sidebar-header {
      height: 58px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 12px;

      border-bottom:
        1px solid var(--border);
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
    }

    .new-chat-btn {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border-radius: 6px;

      background:
        var(--accent);

      color: white;

      cursor: pointer;

      transition:
        background 0.15s ease;
    }

    .new-chat-btn:hover {
      background:
        var(--accent-hover);
    }

    .new-chat-btn svg {
      width: 18px;
      height: 18px;
    }

    .chats-list {
      flex: 1;

      overflow-y: auto;

      padding: 8px;
    }

    .chat-item {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 5px;

      padding: 7px 7px 7px 10px;

      margin-bottom: 2px;

      border-radius: 6px;

      background:
        transparent;

      color:
        var(--text-secondary);

      cursor:
        pointer;

      transition:
        background 0.12s ease,
        color 0.12s ease;
    }

    .chat-item:hover {
      background:
        var(--sidebar-hover);

      color:
        var(--text);
    }

    .chat-item.active {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .chat-item-title {
      min-width: 0;
      flex: 1;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 12px;
    }

    .chat-item-actions {
      display: flex;
      align-items: center;

      gap: 1px;

      opacity: 0;

      transition:
        opacity 0.12s ease;
    }

    .chat-item:hover .chat-item-actions,
    .chat-item.active .chat-item-actions {
      opacity: 1;
    }

    .chat-item-action {
      width: 24px;
      height: 24px;

      display: grid;
      place-items: center;

      border-radius: 5px;

      background:
        transparent;

      color:
        var(--text-muted);

      cursor:
        pointer;
    }

    .chat-item-action:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .chat-item-action.delete:hover {
      background:
        rgba(237, 66, 69, 0.12);

      color:
        var(--danger);
    }

    /* =====================================================
       USER PANEL
    ===================================================== */

    .user-panel {
      flex-shrink: 0;

      padding: 10px;

      border-top:
        1px solid var(--border);
    }

    .user-info {
      display: flex;
      align-items: center;

      gap: 9px;

      padding: 5px;
    }

    .avatar {
      width: 34px;
      height: 34px;

      flex-shrink: 0;

      border-radius: 50%;

      object-fit: cover;

      background:
        var(--surface-hover);
    }

    .user-details {
      min-width: 0;
      flex: 1;
    }

    .user-name,
    .user-email {
      overflow:
        hidden;

      white-space:
        nowrap;

      text-overflow:
        ellipsis;
    }

    .user-name {
      font-size:
        12px;

      font-weight:
        600;
    }

    .user-email {
      margin-top:
        2px;

      color:
        var(--text-muted);

      font-size:
        10px;
    }

    .signout-btn {
      width: 100%;

      margin-top:
        4px;

      padding:
        8px;

      border-radius:
        6px;

      background:
        transparent;

      color:
        var(--text-muted);

      text-align:
        left;

      font-size:
        11px;

      cursor:
        pointer;
    }

    .signout-btn:hover {
      background:
        rgba(237, 66, 69, 0.10);

      color:
        var(--danger);
    }

    /* =====================================================
       MAIN CHAT
    ===================================================== */

    .chat {
      min-width:
        0;

      flex:
        1;

      display:
        flex;

      flex-direction:
        column;

      background:
        var(--surface);
    }

    .chat-header {
      height:
        58px;

      flex-shrink:
        0;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        0 12px;

      border-bottom:
        1px solid var(--border);
    }

    /* =====================================================
       CURRENT CHAT TAB
    ===================================================== */

    .current-tab {
      max-width:
        min(70%, 700px);

      display:
        flex;

      align-items:
        center;

      gap:
        4px;

      min-width:
        0;

      padding:
        3px 4px 3px 9px;

      border-radius:
        6px;

      background:
        var(--surface-hover);

      border:
        1px solid var(--border);
    }

    .current-tab-title {
      min-width:
        0;

      overflow:
        hidden;

      white-space:
        nowrap;

      text-overflow:
        ellipsis;

      font-size:
        12px;

      font-weight:
        600;
    }

    .current-tab-model {
      margin-left:
        7px;

      color:
        var(--text-muted);

      font-size:
        9px;
    }

    .close-tab-btn {
      width:
        27px;

      height:
        27px;

      flex-shrink:
        0;

      display:
        grid;

      place-items:
        center;

      border-radius:
        5px;

      background:
        transparent;

      color:
        var(--text-muted);

      cursor:
        pointer;
    }

    .close-tab-btn:hover {
      background:
        rgba(237, 66, 69, 0.12);

      color:
        var(--danger);
    }

    .header-actions {
      display:
        flex;

      align-items:
        center;

      gap:
        4px;
    }

    .icon-btn {
      width:
        34px;

      height:
        34px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        6px;

      background:
        transparent;

      color:
        var(--text-secondary);

      cursor:
        pointer;
    }

    .icon-btn:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .icon-btn svg {
      width:
        18px;

      height:
        18px;
    }

    /* =====================================================
       MESSAGES
    ===================================================== */

    .messages {
      flex:
        1;

      min-height:
        0;

      overflow-y:
        auto;

      padding:
        24px 0 32px;

      scrollbar-width:
        thin;

      scrollbar-color:
        var(--border-strong)
        transparent;
    }

    .messages::-webkit-scrollbar {
      width:
        8px;
    }

    .messages::-webkit-scrollbar-track {
      background:
        transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background:
        var(--border-strong);

      border-radius:
        999px;
    }

    .empty-state {
      max-width:
        650px;

      margin:
        100px auto 0;

      padding:
        0 20px;

      text-align:
        center;
    }

    .empty-state h1 {
      margin-bottom:
        10px;

      font-size:
        30px;

      letter-spacing:
        -0.5px;
    }

    .empty-state p {
      color:
        var(--text-secondary);

      font-size:
        14px;

      line-height:
        1.6;
    }

    .message-row {
      position:
        relative;

      width:
        100%;

      padding:
        10px 24px;

      animation:
        messageIn 0.18s ease;
    }

    .message-row:hover {
      background:
        rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"]
    .message-row:hover {
      background:
        rgba(0, 0, 0, 0.08);
    }

    .message-container {
      max-width:
        860px;

      margin:
        0 auto;
    }

    .message {
      min-width:
        0;
    }

    .message.user .message-content {
      width:
        fit-content;

      max-width:
        82%;

      margin-left:
        auto;

      padding:
        10px 14px;

      border-radius:
        9px 9px 2px 9px;

      background:
        var(--user-message);

      color:
        var(--text);

      white-space:
        pre-wrap;

      line-height:
        1.5;
    }

    .message.ai .message-content {
      font-size:
        14px;

      line-height:
        1.68;

      word-break:
        break-word;
    }

    /* =====================================================
       MESSAGE TOOLBAR
    ===================================================== */

    .message-toolbar {
      display:
        flex;

      align-items:
        center;

      gap:
        3px;

      margin-top:
        6px;

      opacity:
        0;

      transition:
        opacity 0.15s ease;
    }

    .message-row:hover
    .message-toolbar {
      opacity:
        1;
    }

    .message-action {
      display:
        inline-flex;

      align-items:
        center;

      gap:
        4px;

      min-height:
        27px;

      padding:
        4px 7px;

      border-radius:
        5px;

      background:
        transparent;

      color:
        var(--text-muted);

      cursor:
        pointer;

      font-size:
        10px;

      transition:
        background 0.12s ease,
        color 0.12s ease;
    }

    .message-action:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .message-action.delete:hover {
      background:
        rgba(237, 66, 69, 0.12);

      color:
        var(--danger);
    }

    .message-action.retry:hover {
      background:
        rgba(250, 166, 26, 0.10);

      color:
        var(--warning);
    }

    .message-action svg {
      width:
        13px;

      height:
        13px;
    }

    /* =====================================================
       MARKDOWN
    ===================================================== */

    .message-content p {
      margin-bottom:
        12px;
    }

    .message-content p:last-child {
      margin-bottom:
        0;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3,
    .message-content h4 {
      margin:
        20px 0 9px;

      line-height:
        1.35;
    }

    .message-content h1 {
      font-size:
        23px;
    }

    .message-content h2 {
      font-size:
        19px;
    }

    .message-content h3 {
      font-size:
        16px;
    }

    .message-content ul,
    .message-content ol {
      margin:
        9px 0 14px;

      padding-left:
        22px;
    }

    .message-content li {
      margin:
        5px 0;
    }

    .message-content blockquote {
      margin:
        14px 0;

      padding:
        9px 13px;

      border-left:
        3px solid var(--accent);

      background:
        rgba(88, 101, 242, 0.08);

      color:
        var(--text-secondary);
    }

    .message-content a {
      color:
        #8ea1ff;

      text-decoration:
        underline;
    }

    .message-content code:not(pre code) {
      padding:
        2px 5px;

      border-radius:
        4px;

      background:
        rgba(88, 101, 242, 0.12);

      color:
        #d7d9ff;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size:
        0.88em;
    }

    /* =====================================================
       CODE
    ===================================================== */

    .code-wrapper {
      margin:
        14px 0;

      overflow:
        hidden;

      border:
        1px solid var(--border);

      border-radius:
        7px;

      background:
        var(--code-bg);
    }

    .code-header {
      min-height:
        33px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        0 10px;

      background:
        #1e1f22;

      color:
        #949ba4;

      font-family:
        monospace;

      font-size:
        10px;
    }

    .code-copy {
      padding:
        4px 7px;

      border-radius:
        4px;

      background:
        rgba(255, 255, 255, 0.06);

      color:
        #b5bac1;

      cursor:
        pointer;

      font-size:
        10px;
    }

    .code-copy:hover {
      background:
        rgba(255, 255, 255, 0.12);

      color:
        white;
    }

    .message-content pre {
      margin:
        0;

      padding:
        14px;

      overflow-x:
        auto;

      background:
        var(--code-bg);

      color:
        #e6edf3;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size:
        12px;

      line-height:
        1.6;
    }

    /* =====================================================
       TYPING
    ===================================================== */

    .typing {
      display:
        inline-flex;

      align-items:
        center;

      gap:
        4px;

      padding:
        8px 0;
    }

    .typing-dot {
      width:
        6px;

      height:
        6px;

      border-radius:
        50%;

      background:
        var(--text-muted);

      animation:
        typing 1.15s
        infinite
        ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay:
        0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay:
        0.30s;
    }

    /* =====================================================
       SOURCES
    ===================================================== */

    .sources {
      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        6px;

      margin-top:
        12px;

      padding-top:
        8px;

      border-top:
        1px solid var(--border);

      color:
        var(--text-muted);

      font-size:
        10px;
    }

    .source-link {
      padding:
        4px 7px;

      border:
        1px solid var(--border);

      border-radius:
        4px;

      color:
        var(--text-secondary);

      text-decoration:
        none;
    }

    .source-link:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer-wrap {
      flex-shrink:
        0;

      padding:
        10px 18px 16px;

      background:
        var(--surface);
    }

    .composer {
      display:
        flex;

      align-items:
        flex-end;

      gap:
        7px;

      padding:
        8px;

      border:
        1px solid var(--border-strong);

      border-radius:
        8px;

      background:
        var(--input);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .composer:focus-within {
      border-color:
        rgba(88, 101, 242, 0.65);

      box-shadow:
        0 0 0 1px
        rgba(88, 101, 242, 0.15);
    }

    .web-search-btn {
      width:
        40px;

      height:
        40px;

      flex-shrink:
        0;

      display:
        grid;

      place-items:
        center;

      border-radius:
        6px;

      background:
        transparent;

      color:
        var(--text-muted);

      cursor:
        pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    .web-search-btn:hover {
      background:
        var(--surface-hover);

      color:
        var(--text);
    }

    .web-search-btn.active {
      background:
        rgba(88, 101, 242, 0.18);

      color:
        #aab1ff;
    }

    .web-search-btn svg {
      width:
        18px;

      height:
        18px;
    }

    .composer textarea {
      flex:
        1;

      min-height:
        40px;

      max-height:
        180px;

      resize:
        none;

      border:
        0;

      outline:
        0;

      background:
        transparent;

      color:
        var(--text);

      padding:
        9px 2px;

      font-size:
        14px;

      line-height:
        1.5;
    }

    .composer textarea::placeholder {
      color:
        var(--text-muted);
    }

    .send-btn {
      width:
        40px;

      height:
        40px;

      flex-shrink:
        0;

      display:
        grid;

      place-items:
        center;

      border-radius:
        6px;

      background:
        var(--accent);

      color:
        white;

      cursor:
        pointer;

      transition:
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .send-btn:hover:not(:disabled) {
      background:
        var(--accent-hover);
    }

    .send-btn.stop {
      background:
        var(--danger);
    }

    .send-btn:disabled {
      opacity:
        0.38;

      cursor:
        not-allowed;
    }

    .send-btn svg {
      width:
        17px;

      height:
        17px;
    }

    .composer-footer {
      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        6px 2px 0;

      color:
        var(--text-muted);

      font-size:
        9px;
    }

    .search-status.active {
      color:
        #8ea1ff;
    }

    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position:
        fixed;

      left:
        50%;

      bottom:
        24px;

      z-index:
        100;

      transform:
        translate(-50%, 15px);

      padding:
        9px 13px;

      border:
        1px solid var(--border);

      border-radius:
        6px;

      background:
        #111214;

      color:
        white;

      font-size:
        11px;

      opacity:
        0;

      pointer-events:
        none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .toast.show {
      opacity:
        1;

      transform:
        translate(-50%, 0);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 760px) {
      .sidebar {
        width:
          220px;
      }

      .message-row {
        padding-left:
          12px;

        padding-right:
          12px;
      }

      .message-toolbar {
        opacity:
          1;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        width:
          190px;
      }

      .current-tab-model {
        display:
          none;
      }

      .composer-wrap {
        padding:
          8px 10px 10px;
      }
    }

    @media (max-width: 500px) {
      .sidebar {
        width:
          175px;
      }

      .message.user .message-content {
        max-width:
          92%;
      }

      .message-action span {
        display:
          none;
      }
    }

    @keyframes messageIn {
      from {
        opacity:
          0;

        transform:
          translateY(4px);
      }

      to {
        opacity:
          1;

        transform:
          translateY(0);
      }
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity:
          0.35;

        transform:
          translateY(0);
      }

      30% {
        opacity:
          1;

        transform:
          translateY(-3px);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       SIDEBAR
  ====================================================== -->

  <aside class="sidebar">

    <header class="sidebar-header">

      <div class="brand">
        Free AI
      </div>

      <button

  /* =========================================================

  /* =========================================================

  const chatsList =

  let currentUser =

  let currentSession =

  let messageRecords =
    [];

  let isGenerating =
    false;

  let controller =
    null;

  let webSearchEnabled =
    false;

    null;


  /* =========================================================
     CONFIG VALIDATION
  ========================================================= */

  function isConfigured() {

    return (
      SUPABASE_URL &&
      SUPABASE_URL.startsWith(
        "https://"
      ) &&

      !SUPABASE_URL.includes(

      SUPABASE_PUBLISHABLE_KEY &&

        "YOUR_"
      ) &&

      WORKER_URL &&

      !WORKER_URL.includes(
        "YOUR_"
      )
    );
  }


  /* =========================================================
     TOAST
  ========================================================= */

  function showToast(
    message
  ) {

    toastEl.textContent =
      message;

    toastEl.classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {

          toastEl.classList.remove(
            "show"
          );

        },
        2500
      );
  }


  /* =========================================================
     THEME
  ========================================================= */

  function loadTheme() {

    const saved =
      localStorage.getItem(
        THEME_KEY
      );

    if (saved) {

      document.documentElement
        .dataset.theme =
        saved;
    }
  }


  function updateThemeIcon() {

    const dark =
      document.documentElement
        .dataset.theme ===
      "dark";


    if (dark) {

      themeIcon.innerHTML = `
        <circle
          cx="12"
          cy="12"
          r="4"
        />

        <path
          d="
            M12 2v2
            M12 20v2
            M4.93 4.93l1.42 1.42
            M17.65 17.65l1.42 1.42
            M2 12h2
            M20 12h2
            M4.93 19.07l1.42-1.42
            M17.65 6.35l1.42-1.42
          "
        />
      `;

    } else {

      themeIcon.innerHTML = `
        <path
          d="
            M21 12.8
            A8.5 8.5 0 1 1
            11.2 3
            A6.7 6.7 0 0 0
            21 12.8z
          "
        />
      `;
    }
  }


  themeBtn.addEventListener(
    "click",
    () => {

      const current =
        document.documentElement
          .dataset.theme;


      const next =
        current === "dark"
          ? "light"
          : "dark";


      document.documentElement
        .dataset.theme =
        next;


      localStorage.setItem(
        THEME_KEY,
        next
      );


      updateThemeIcon();
    }
  );


  loadTheme();
  updateThemeIcon();


  /* =========================================================
     AUTH
  ========================================================= */

  async function ensureFreshSession() {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .refreshSession();


    if (
      error ||
      !data?.session
    ) {

      console.error(
        "Session refresh failed:",
        error
      );

      await supabaseClient.auth
        .signOut();

      window.location.replace(
        LOGIN_PAGE
      );

      return null;
    }


    currentSession =
      data.session;

    currentUser =
      data.session.user;


    return data.session;
  }


  async function initializeAuth() {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();


    if (
      error ||
      !data?.session
    ) {

      window.location.replace(
        LOGIN_PAGE
      );

      return false;
    }


    currentSession =
      data.session;

    currentUser =
      data.session.user;


    /*
     * Refresh immediately when opening
     * the chat page so we start with
     * a valid access token.
     */

    const refreshed =
      await ensureFreshSession();


    return Boolean(
      refreshed
    );
  }


  supabaseClient.auth
    .onAuthStateChange(
      (
        event,
        session
      ) => {

        currentSession =
          session;

        currentUser =
          session?.user ||
          null;


        if (!session) {

          window.location.replace(
            LOGIN_PAGE
          );
        }
      }
    );


  /* =========================================================
     USER UI
  ========================================================= */

  function fallbackAvatar(
    name
  ) {

    const letter =
      (
        name ||
        "U"
      )
        .trim()
        .charAt(0)
        .toUpperCase() ||
      "U";


    return (
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(
        `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="64"
          height="64"
          viewBox="0 0 64 64"
        >
          <rect
            width="64"
            height="64"
            fill="#5865f2"
          />

          <text
            x="50%"
            y="54%"
            dominant-baseline="middle"
            text-anchor="middle"
            fill="white"
            font-size="28"
            font-family="Arial"
            font-weight="bold"
          >
            ${letter}
          </text>
        </svg>
        `
      )
    );
  }


  function renderUser() {

    if (!currentUser) {
      return;
    }


    const metadata =
      currentUser.user_metadata ||
      {};


    const name =
      metadata.full_name ||
      metadata.name ||
      currentUser.email ||
      "User";


    userName.textContent =
      name;


    userEmail.textContent =
      currentUser.email ||
      "";


    userAvatar.src =
      metadata.avatar_url ||
      fallbackAvatar(
        name
      );
  }


  /* =========================================================
     CURRENT CHAT TAB
  ========================================================= */

  function updateCurrentTab() {

    if (!currentChat) {

      currentTab.hidden =
        true;

      return;
    }


    currentTab.hidden =
      false;


    currentTabTitle.textContent =
      currentChat.title ||
      "New chat";
  }


  /*
   * Close means "close the current tab",
   * not "delete the conversation".
   *
   * The conversation stays safely stored
   * in Supabase and can be reopened from
   * the sidebar.
   */

  closeTabBtn.addEventListener(
    "click",
    () => {

      if (
        isGenerating
      ) {

        stopGeneration();
      }


      currentChat =
        null;

      messageRecords =
        [];

      localStorage.removeItem(
        CHAT_STORAGE_KEY
      );


      updateCurrentTab();

      renderMessages();

      userInput.focus();
    }
  );


  /* =========================================================
     CHAT TITLE
  ========================================================= */

  function makeChatTitle(
    text
  ) {

    const clean =
      text
        .replace(
          /\s+/g,
          " "
        )
        .trim();


    if (!clean) {
      return "New chat";
    }


    if (
      clean.length <= 42
    ) {

      return clean;
    }


    return (
      clean.slice(
        0,
        39
      ) +
      "..."
    );
  }


  /* =========================================================
     LOAD CHATS
  ========================================================= */

  async function loadChats() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("chats")
        .select(
          "id,user_id,title,created_at,updated_at"
        )
        .order(
          "updated_at",
          {
            ascending:
              false
          }
        );


    if (error) {

      console.error(
        "loadChats:",
        error
      );

      showToast(
        error.message ||
          "Could not load chats."
      );

      return [];
    }


    chatsList.innerHTML =
      "";


    for (
      const chat
      of data || []
    ) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "chat-item";


      if (
        currentChat &&
        currentChat.id ===
          chat.id
      ) {

        item.classList.add(
          "active"
        );
      }


      const title =
        document.createElement(
          "span"
        );


      title.className =
        "chat-item-title";


      title.textContent =
        chat.title ||
        "New chat";


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "chat-item-actions";


      /*
       * Close tab.
       */

      const closeBtn =
        document.createElement(
          "button"
        );


      closeBtn.type =
        "button";

      closeBtn.className =
        "chat-item-action";

      closeBtn.title =
        "Close tab";

      closeBtn.setAttribute(
        "aria-label",
        "Close tab"
      );

      closeBtn.innerHTML = `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M6 6l12 12"/>
          <path d="M18 6L6 18"/>
        </svg>
      `;


      closeBtn.addEventListener(
        "click",
        event => {

          event.stopPropagation();


          if (
            currentChat &&
            currentChat.id ===
              chat.id
          ) {

            closeTabBtn.click();
          }
        }
      );


      /*
       * Delete chat.
       */

      const deleteBtn =
        document.createElement(
          "button"
        );


      deleteBtn.type =
        "button";

      deleteBtn.className =
        "chat-item-action delete";

      deleteBtn.title =
        "Delete chat";

      deleteBtn.setAttribute(
        "aria-label",
        "Delete chat"
      );

      deleteBtn.innerHTML = `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 6h18"/>
          <path d="M8 6V4h8v2"/>
          <path d="M19 6l-1 15H6L5 6"/>
          <path d="M10 11v6"/>
          <path d="M14 11v6"/>
        </svg>
      `;


      deleteBtn.addEventListener(
        "click",
        async event => {

          event.stopPropagation();

          await deleteChat(
            chat.id
          );
        }
      );


      actions.appendChild(
        closeBtn
      );

      actions.appendChild(
        deleteBtn
      );


      item.appendChild(
        title
      );

      item.appendChild(
        actions
      );


      item.addEventListener(
        "click",
        () => {

          openChat(
            chat.id
          );
        }
      );


      chatsList.appendChild(
        item
      );
    }


    return data || [];
  }


  /* =========================================================
     CREATE CHAT
  ========================================================= */

  async function createChat(
    title = "New chat"
  ) {

    if (!currentUser) {
      return null;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("chats")
        .insert({
          user_id:
            currentUser.id,

          title
        })
        .select()
        .single();


    if (error) {

      console.error(
        "createChat:",
        error
      );

      showToast(
        error.message ||
          "Could not create chat."
      );

      return null;
    }


    currentChat =
      data;


    messageRecords =
      [];


    localStorage.setItem(
      CHAT_STORAGE_KEY,
      data.id
    );


    updateCurrentTab();

    renderMessages();

    await loadChats();


    return data;
  }


  /* =========================================================
     UPDATE CHAT TITLE
  ========================================================= */

  async function updateChatTitle(
    title
  ) {

    if (!currentChat) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("chats")
        .update({
          title,

          updated_at:
            new Date()
              .toISOString()
        })
        .eq(
          "id",
          currentChat.id
        )
        .select()
        .single();


    if (error) {

      console.error(
        "updateChatTitle:",
        error
      );

      return;
    }


    currentChat =
      data;


    updateCurrentTab();
  }


  /* =========================================================
     DELETE CHAT
  ========================================================= */

  async function deleteChat(
    chatId
  ) {

    const confirmed =
      window.confirm(
        "Delete this entire conversation?"
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("chats")
        .delete()
        .eq(
          "id",
          chatId
        );


    if (error) {

      console.error(
        "deleteChat:",
        error
      );

      showToast(
        error.message ||
          "Could not delete chat."
      );

      return;
    }


    if (
      currentChat &&
      currentChat.id ===
        chatId
    ) {

      stopGeneration();


      currentChat =
        null;

      messageRecords =
        [];


      localStorage.removeItem(
        CHAT_STORAGE_KEY
      );


      updateCurrentTab();

      renderMessages();
    }


    await loadChats();
  }


  /* =========================================================
     OPEN CHAT
  ========================================================= */

  async function openChat(
    chatId
  ) {

    if (
      isGenerating
    ) {

      stopGeneration();
    }


    const {
      data: chat,
      error: chatError
    } =
      await supabaseClient
        .from("chats")
        .select("*")
        .eq(
          "id",
          chatId
        )
        .single();


    if (chatError) {

      console.error(
        "openChat:",
        chatError
      );

      showToast(
        chatError.message ||
          "Could not open chat."
      );

      return;
    }


    const {
      data: messages,
      error: messageError
    } =
      await supabaseClient
        .from("messages")
        .select(
          "id,chat_id,role,content,created_at"
        )
        .eq(
          "chat_id",
          chatId
        )
        .order(
          "created_at",
          {
            ascending:
              true
          }
        );


    if (messageError) {

      console.error(
        "openChat messages:",
        messageError
      );

      showToast(
        messageError.message ||
          "Could not load messages."
      );

      return;
    }


    currentChat =
      chat;


    messageRecords =
      messages || [];


    localStorage.setItem(
      CHAT_STORAGE_KEY,
      chat.id
    );


    updateCurrentTab();

    renderMessages();

    await loadChats();
  }


  /* =========================================================
     SAVE MESSAGE
  ========================================================= */

  async function saveMessage(
    role,
    content
  ) {

    if (!currentChat) {
      return null;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("messages")
        .insert({
          chat_id:
            currentChat.id,

          role,

          content
        })
        .select()
        .single();


    if (error) {

      console.error(
        "saveMessage:",
        error
      );

      throw new Error(
        error.message ||
          "Could not save message."
      );
    }


    messageRecords.push(
      data
    );


    return data;
  }


  /* =========================================================
     UPDATE CHAT TIME
  ========================================================= */

  async function touchChat() {

    if (!currentChat) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("chats")
        .update({
          updated_at:
            new Date()
              .toISOString()
        })
        .eq(
          "id",
          currentChat.id
        )
        .select()
        .single();


    if (
      !error &&
      data
    ) {

      currentChat =
        data;

      updateCurrentTab();
    }
  }


  /* =========================================================
     DELETE MESSAGE
  ========================================================= */

  async function deleteMessage(
    messageId
  ) {

    const confirmed =
      window.confirm(
        "Delete this message?"
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("messages")
        .delete()
        .eq(
          "id",
          messageId
        )
        .eq(
          "chat_id",
          currentChat.id
        );


    if (error) {

      console.error(
        "deleteMessage:",
        error
      );

      showToast(
        error.message ||
          "Could not delete message."
      );

      return;
    }


    messageRecords =
      messageRecords.filter(
        message =>
          message.id !==
          messageId
      );


    renderMessages();


    await touchChat();

    await loadChats();


    showToast(
      "Message deleted."
    );
  }


  /* =========================================================
     MARKDOWN
  ========================================================= */

  marked.setOptions({
    breaks:
      true,

    gfm:
      true
  });


  function renderMarkdown(
    text
  ) {

    const html =
      marked.parse(
        text || ""
      );


    return DOMPurify.sanitize(
      html,
      {
        USE_PROFILES: {
          html:
            true
        }
      }
    );
  }


  /* =========================================================
     CODE BLOCKS
  ========================================================= */

  function enhanceCodeBlocks(
    container
  ) {

    container
      .querySelectorAll(
        "pre"
      )
      .forEach(
        pre => {

          if (
            pre.parentElement &&
            pre.parentElement
              .classList
              .contains(
                "code-wrapper"
              )
          ) {

            return;
          }


          const code =
            pre.querySelector(
              "code"
            );


          if (!code) {
            return;
          }


          const wrapper =
            document.createElement(
              "div"
            );


          wrapper.className =
            "code-wrapper";


          const header =
            document.createElement(
              "div"
            );


          header.className =
            "code-header";


          const language =
            document.createElement(
              "span"
            );


          const languageClass =
            Array.from(
              code.classList
            ).find(
              value =>
                value.startsWith(
                  "language-"
                )
            );


          language.textContent =
            languageClass
              ? languageClass.replace(
                  "language-",
                  ""
                )
              : "code";


          const copy =
            document.createElement(
              "button"
            );


          copy.type =
            "button";

          copy.className =
            "code-copy";

          copy.textContent =
            "Copy";


          copy.addEventListener(
            "click",
            async () => {

              try {

                await navigator
                  .clipboard
                  .writeText(
                    code.textContent
                  );


                copy.textContent =
                  "Copied";


                setTimeout(
                  () => {

                    copy.textContent =
                      "Copy";

                  },
                  1200
                );

              } catch {

                showToast(
                  "Could not copy code."
                );
              }
            }
          );


          header.appendChild(
            language
          );

          header.appendChild(
            copy
          );


          pre.parentNode
            .insertBefore(
              wrapper,
              pre
            );


          wrapper.appendChild(
            header
          );

          wrapper.appendChild(
            pre
          );
        }
      );
  }

  /* =========================================================
     MESSAGE TOOL BUTTON
  ========================================================= */

  function createMessageAction(
    label,
    type,
    callback
  ) {

    const button =
      document.createElement(
        "button"
      );


    button.type =
      "button";

    button.className =
      "message-action " +
      type;

    button.innerHTML =
      ICONS[type] +
      `<span>${label}</span>`;


    button.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        callback();
      }
    );


    return button;
  }


  /* =========================================================
     COPY MESSAGE
  ========================================================= */

  async function copyMessage(
    content
  ) {

    try {

      await navigator.clipboard
        .writeText(
          content
        );


      showToast(
        "Message copied."
      );

    } catch {

      showToast(
        "Could not copy message."
      );
    }
  }


  /* =========================================================
     RENDER MESSAGE
  ========================================================= */

  function renderMessage(
    record,
    index
  ) {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "message-row";


    row.dataset.messageId =
      record.id;


    const container =
      document.createElement(
        "div"
      );


    container.className =
      "message-container";


    const message =
      document.createElement(
        "article"
      );


    message.className =
      record.role ===
      "user"
        ? "message user"
        : "message ai";


    const content =
      document.createElement(
        "div"
      );


    content.className =
      "message-content";


    if (
      record.role ===
      "user"
    ) {

      content.textContent =
        record.content;

    } else {

      content.innerHTML =
        renderMarkdown(
          record.content
        );


      enhanceCodeBlocks(
        content
      );
    }


    message.appendChild(
      content
    );


    const toolbar =
      document.createElement(
        "div"
      );


    toolbar.className =
      "message-toolbar";


    /*
     * COPY
     */

    toolbar.appendChild(
      createMessageAction(
        "Copy",
        "copy",
        () =>
          copyMessage(
            record.content
          )
      )
    );


    /*
     * RETRY
     */

    toolbar.appendChild(
      createMessageAction(
        "Retry",
        "retry",
        () =>
          retryMessage(
            index
          )
      )
    );


    /*
     * DELETE
     */

    toolbar.appendChild(
      createMessageAction(
        "Delete",
        "delete",
        () =>
          deleteMessage(
            record.id
          )
      )
    );


    message.appendChild(
      toolbar
    );


    container.appendChild(
      message
    );


    row.appendChild(
      container
    );


    return row;
  }


  /* =========================================================
     RENDER ALL MESSAGES
  ========================================================= */

  function renderMessages() {

    messagesEl.innerHTML =
      "";


    if (
      messageRecords.length ===
      0
    ) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "empty-state";


      empty.innerHTML = `
        <h1>
          What can I help you with?
        </h1>

        <p>
          Start a conversation, ask a question,
          write code, or search the web.
        </p>
      `;


      messagesEl.appendChild(
        empty
      );


      return;
    }


    messageRecords.forEach(
      (
        record,
        index
      ) => {

        messagesEl.appendChild(
          renderMessage(
            record,
            index
          )
        );
      }
    );


    scrollToBottom();
  }


  /* =========================================================
     SCROLL
  ========================================================= */

  function scrollToBottom() {

    requestAnimationFrame(
      () => {

        messagesEl.scrollTop =
          messagesEl.scrollHeight;
      }
    );
  }


  /* =========================================================
     COMPOSER
  ========================================================= */

  function resizeInput() {

    userInput.style.height =
      "auto";


    userInput.style.height =
      Math.min(
        userInput.scrollHeight,
        180
      ) +
      "px";
  }


  userInput.addEventListener(
    "input",
    () => {

      resizeInput();

      updateSendButton();
    }
  );


  /* =========================================================
     BUTTON STATE
  ========================================================= */

  function updateSendButton() {

    if (
      isGenerating
    ) {

      sendBtn.disabled =
        false;

      sendBtn.classList.add(
        "stop"
      );

      sendBtn.title =
        "Stop generation";

      sendBtn.setAttribute(
        "aria-label",
        "Stop generation"
      );


      sendIcon.innerHTML = `
        <rect
          x="7"
          y="7"
          width="10"
          height="10"
          rx="2"
        />
      `;


      return;
    }


    sendBtn.disabled =
      !userInput.value.trim();


    sendBtn.classList.remove(
      "stop"
    );


    sendBtn.title =
      "Send message";

    sendBtn.setAttribute(
      "aria-label",
      "Send message"
    );


    sendIcon.innerHTML = `
      <path d="M22 2 11 13"/>

      <path
        d="
          m22 2-7 20
          -4-9
          -9-4
          20-7z
        "
      />
    `;
  }


  /* =========================================================
     WEB SEARCH
  ========================================================= */

  webSearchBtn.addEventListener(
    "click",
    () => {

      webSearchEnabled =
        !webSearchEnabled;


      webSearchBtn.classList.toggle(
        "active",
        webSearchEnabled
      );


      searchStatus.classList.toggle(
        "active",
        webSearchEnabled
      );


      searchStatus.textContent =
        webSearchEnabled
          ? "Web search on"
          : "Web search off";
    }
  );


  /* =========================================================
     NEW CHAT
  ========================================================= */

  newChatBtn.addEventListener(
    "click",
    async () => {

      if (
        isGenerating
      ) {

        stopGeneration();
      }


      const chat =
        await createChat(
          "New chat"
        );


      if (
        chat
      ) {

        userInput.focus();
      }
    }
  );


  /* =========================================================
     CLOSE ACTIVE CHAT
  ========================================================= */

  function closeCurrentChat() {

    if (
      isGenerating
    ) {

      stopGeneration();
    }


    currentChat =
      null;

    messageRecords =
      [];


    localStorage.removeItem(
      CHAT_STORAGE_KEY
    );


    updateCurrentTab();

    renderMessages();

    userInput.focus();
  }


  /* =========================================================
     RETRY MESSAGE
  ========================================================= */

  async function retryMessage(
    index
  ) {

    if (
      isGenerating
    ) {

      showToast(
        "Please wait for the current response."
      );

      return;
    }


    if (
      !currentChat
    ) {

      return;
    }


    const selected =
      messageRecords[index];


    if (!selected) {
      return;
    }


    /*
     * Find the user message that should
     * be regenerated.
     *
     * Clicking Retry on an assistant
     * message uses the previous user message.
     *
     * Clicking Retry on a user message
     * uses that message itself.
     */

    let userIndex =
      index;


    if (
      selected.role ===
      "assistant"
    ) {

      for (
        let i = index - 1;
        i >= 0;
        i--
      ) {

        if (
          messageRecords[i].role ===
          "user"
        ) {

          userIndex =
            i;

          break;
        }
      }
    }


    const userMessage =
      messageRecords[userIndex];


    if (
      !userMessage ||
      userMessage.role !==
        "user"
    ) {

      showToast(
        "Could not find the user message to retry."
      );

      return;
    }


    /*
     * Remove all messages after the
     * selected user message from the DB.
     *
     * The user's original message remains.
     */

    const idsToDelete =
      messageRecords
        .slice(
          userIndex + 1
        )
        .map(
          message =>
            message.id
        );


    if (
      idsToDelete.length > 0
    ) {

      const {
        error
      } =
        await supabaseClient
          .from("messages")
          .delete()
          .in(
            "id",
            idsToDelete
          )
          .eq(
            "chat_id",
            currentChat.id
          );


      if (error) {

        console.error(
          "Retry cleanup:",
          error
        );

        showToast(
          error.message ||
            "Could not prepare retry."
        );

        return;
      }
    }


    messageRecords =
      messageRecords.slice(
        0,
        userIndex + 1
      );


    renderMessages();


    await touchChat();


    /*
     * Generate without inserting
     * the user message a second time.
     */

    await generateResponse();


  }


  /* =========================================================
     BUILD WORKER MESSAGES
  ========================================================= */

  function buildWorkerMessages() {

    return messageRecords
      .filter(
        message =>
          message.role ===
            "user" ||
          message.role ===
            "assistant"
      )
      .map(
        message => ({
          role:
            message.role,

          content:
            message.content
        })
      );
  }


  /* =========================================================
     CREATE STREAMING MESSAGE
  ========================================================= */

  function createStreamingMessage() {

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "message-row";


    const container =
      document.createElement(
        "div"
      );


    container.className =
      "message-container";


    const message =
      document.createElement(
        "article"
      );


    message.className =
      "message ai";


    const content =
      document.createElement(
        "div"
      );


    content.className =
      "message-content";


    const typing =
      document.createElement(
        "div"
      );


    typing.className =
      "typing";


    typing.innerHTML = `
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
      <span class="typing-dot"></span>
    `;


    content.appendChild(
      typing
    );


    message.appendChild(
      content
    );


    container.appendChild(
      message
    );


    row.appendChild(
      container
    );


    messagesEl.appendChild(
      row
    );


    scrollToBottom();


    return {
      row,
      content
    };
  }


  /* =========================================================
     STREAM READER
  ========================================================= */

  async function readStream(
    response,
    contentElement
  ) {

    if (
      !response.body
    ) {

      throw new Error(
        "The Worker did not return a stream."
      );
    }


    const reader =
      response.body
        .getReader();


    const decoder =
      new TextDecoder(
        "utf-8"
      );


    let buffer =
      "";

    let answer =
      "";


    while (true) {

      const {
        value,
        done
      } =
        await reader.read();


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream:
              true
          }
        );


      const lines =
        buffer.split(
          "\n"
        );


      buffer =
        lines.pop() ||
        "";


      for (
        const rawLine
        of lines
      ) {

        const line =
          rawLine.trim();


        if (
          !line.startsWith(
            "data:"
          )
        ) {

          continue;
        }


        const payload =
          line
            .slice(5)
            .trim();


        if (
          payload ===
          "[DONE]"
        ) {

          continue;
        }


        let parsed;


        try {

          parsed =
            JSON.parse(
              payload
            );

        } catch {

          continue;
        }


        const delta =
          parsed
            ?.choices?.[0]
            ?.delta
            ?.content;


        if (
          typeof delta !==
          "string"
        ) {

          continue;
        }


        answer +=
          delta;


        contentElement.innerHTML =
          renderMarkdown(
            answer
          );


        enhanceCodeBlocks(
          contentElement
        );


        scrollToBottom();
      }
    }


    return answer;
  }


  /* =========================================================
     CALL WORKER
  ========================================================= */

  async function callWorker(
    session
  ) {

    return fetch(
      WORKER_URL,
      {
        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json",

          "Authorization":
            `Bearer ${session.access_token}`
        },

        signal:
          controller.signal,

        body:
          JSON.stringify({

            messages:
              buildWorkerMessages(),

            web_search:
              webSearchEnabled,

            temperature:
              0.7,

            max_tokens:
              4096,

            stream:
              true
          })
      }
    );
  }


  /* =========================================================
     GENERATE RESPONSE
  ========================================================= */

  async function generateResponse() {

    if (
      !currentChat
    ) {

      return;
    }


    isGenerating =
      true;

    controller =
      new AbortController();


    updateSendButton();


    const streamMessage =
      createStreamingMessage();


    try {

      /*
       * First attempt:
       * always use a refreshed session.
       */

      let session =
        await ensureFreshSession();


      if (!session) {
        return;
      }


      let response =
        await callWorker(
          session
        );


      /*
       * If the Worker still returns 401,
       * refresh again and retry exactly once.
       */

      if (
        response.status ===
        401
      ) {

        showToast(
          "Refreshing session..."
        );


        session =
          await ensureFreshSession();


        if (!session) {
          return;
        }


        response =
          await callWorker(
            session
          );
      }


      if (
        !response.ok
      ) {

        let errorMessage =
          `Request failed (${response.status}).`;


        try {

          const errorData =
            await response.json();


          if (
            typeof errorData.error ===
              "string"
          ) {

            errorMessage =
              errorData.error;

          } else if (
            errorData?.error?.message
          ) {

            errorMessage =
              errorData.error.message;
          }

        } catch {

          /*
           * Ignore malformed error bodies.
           */
        }


        throw new Error(
          errorMessage
        );
      }


      const answer =
        await readStream(
          response,
          streamMessage.content
        );


      if (
        !answer.trim()
      ) {

        throw new Error(
          "The AI returned an empty response."
        );
      }


      /*
       * Remove the temporary streamed row
       * and insert the final database-backed
       * assistant message.
       */

      streamMessage.row.remove();


      await saveMessage(
        "assistant",
        answer
      );


      await touchChat();


      renderMessages();


      await loadChats();


    } catch (error) {

      streamMessage.row.remove();


      if (
        error.name ===
        "AbortError"
      ) {

        showToast(
          "Generation stopped."
        );

        return;
      }


      console.error(
        "AI request failed:",
        error
      );


      showToast(
        error.message ||
          "Something went wrong."
      );

    } finally {

      isGenerating =
        false;

      controller =
        null;


      updateSendButton();

      userInput.focus();
    }
  }


  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  async function sendMessage() {

    if (
      isGenerating
    ) {

      stopGeneration();

      return;
    }


    const text =
      userInput.value.trim();


    if (!text) {
      return;
    }


    if (
      !isConfigured()
    ) {

      showToast(
        "Configure Supabase and the Worker URL first."
      );

      return;
    }


    if (
      !currentUser
    ) {

      showToast(
        "Please sign in again."
      );

      return;
    }


    /*
     * Create the chat only when
     * the first real message is sent.
     */

    if (!currentChat) {

      currentChat =
        await createChat(
          makeChatTitle(
            text
          )
        );


      if (!currentChat) {
        return;
      }
    }


    /*
     * Give the chat a useful title.
     */

    if (
      currentChat.title ===
      "New chat"
    ) {

      await updateChatTitle(
        makeChatTitle(
          text
        )
      );
    }


    userInput.value =
      "";

    resizeInput();


    /*
     * Add user message locally.
     */

    const userMessage =
      await saveMessage(
        "user",
        text
      );


    if (!userMessage) {

      showToast(
        "Could not save your message."
      );

      return;
    }


    await touchChat();


    renderMessages();


    /*
     * Generate response.
     */

    await generateResponse();
  }


  /* =========================================================
     STOP
  ========================================================= */

  function stopGeneration() {

    if (
      controller
    ) {

      controller.abort();
    }


    controller =
      null;

    isGenerating =
      false;


    updateSendButton();

    userInput.focus();
  }


  /* =========================================================
     EVENTS
  ========================================================= */

  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  userInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
          "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();


        if (
          !isGenerating
        ) {

          sendMessage();
        }
      }
    }
  );


  /* =========================================================
     INITIALIZE
  ========================================================= */

  async function initialize() {

    if (
      !isConfigured()
    ) {

      showToast(
        "Set your Supabase and Worker configuration."
      );

      return;
    }


    const authenticated =
      await initializeAuth();


    if (
      !authenticated
    ) {

      return;
    }


    renderUser();


    const chats =
      await loadChats();


    const savedChatId =
      localStorage.getItem(
        CHAT_STORAGE_KEY
      );


    let chatToOpen =
      null;


    if (
      savedChatId &&
      chats.some(
        chat =>
          chat.id ===
          savedChatId
      )
    ) {

      chatToOpen =
        savedChatId;

    } else if (
      chats.length > 0
    ) {

      chatToOpen =
        chats[0].id;
    }


    if (
      chatToOpen
    ) {

      await openChat(
        chatToOpen
      );

    } else {

      renderMessages();
    }


    updateCurrentTab();
    updateSendButton();
    resizeInput();

    userInput.focus();
  }


  initialize();

</script>
