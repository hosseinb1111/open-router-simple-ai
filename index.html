  <style>
    :root {
      --background: #313338;
      --background-secondary: #2b2d31;
      --background-tertiary: #1e1f22;

      --surface: #2b2d31;
      --surface-hover: #35373c;

      --input: #383a40;

      --text: #f2f3f5;
      --text-secondary: #b5bac1;
      --text-muted: #80848e;

      --border: rgba(255, 255, 255, 0.06);

      --accent: #5865f2;
      --accent-hover: #4752c4;

      --success: #23a559;
      --danger: #ed4245;

      --user-message: #404249;

      --code-bg: #1e1f22;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.25);

      --radius: 8px;
    }

    [data-theme="light"] {
      --background: #ffffff;
      --background-secondary: #f2f3f5;
      --background-tertiary: #e3e5e8;

      --surface: #f2f3f5;
      --surface-hover: #e7e9eb;

      --input: #ebedef;

      --text: #1e1f22;
      --text-secondary: #4e5058;
      --text-muted: #74777e;

      --border: rgba(0, 0, 0, 0.08);

      --user-message: #e3e5e8;

      --code-bg: #1e1f22;

      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--background);
      color: var(--text);

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    ::selection {
      background: rgba(88, 101, 242, 0.5);
    }


    /* =====================================================
       APP
    ===================================================== */

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }


    /* =====================================================
       TOP BAR
    ===================================================== */

    .topbar {
      height: 56px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: var(--background-secondary);

      border-bottom: 1px solid var(--border);

      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;
    }

    .brand-subtitle {
      display: flex;
      align-items: center;
      gap: 6px;

      color: var(--text-muted);

      font-size: 11px;

      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .icon-btn {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border-radius: 6px;

      background: transparent;
      color: var(--text-secondary);

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
    }


    /* =====================================================
       MAIN
    ===================================================== */

    .main {
      flex: 1;
      min-height: 0;

      display: flex;
      justify-content: center;

      padding: 20px;
    }

    .chat {
      width: 100%;
      max-width: 1050px;

      height: calc(100vh - 96px);
      min-height: 500px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: var(--background-secondary);

      border: 1px solid var(--border);
      border-radius: 10px;

      box-shadow: var(--shadow);
    }


    /* =====================================================
       CHAT HEADER
    ===================================================== */

    .chat-header {
      height: 52px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 14px;

      background: var(--background-secondary);

      border-bottom: 1px solid var(--border);
    }

    .model-info {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .model-status {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--success);
    }

    .model-name {
      font-size: 13px;
      font-weight: 600;
    }

    .model-label {
      margin-top: 2px;

      color: var(--text-muted);

      font-size: 10px;
    }

    .chat-actions {
      display: flex;
      align-items: center;
      gap: 3px;
    }


    /* =====================================================
       MESSAGES
    ===================================================== */

    .messages {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 24px 0 30px;

      overscroll-behavior: contain;

      scrollbar-width: thin;
      scrollbar-color:
        var(--background-tertiary)
        transparent;
    }

    .messages::-webkit-scrollbar {
      width: 8px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--background-tertiary);
      border-radius: 999px;
    }


    /* =====================================================
       WELCOME
    ===================================================== */

    .welcome {
      max-width: 650px;

      margin: 70px auto 50px;

      padding: 0 24px;

      text-align: center;

      animation: fadeIn 0.3s ease;
    }

    .welcome h1 {
      margin-bottom: 10px;

      font-size: clamp(28px, 5vw, 38px);
      font-weight: 700;

      letter-spacing: -0.8px;
    }

    .welcome h1 span {
      color: var(--accent);
    }

    .welcome p {
      max-width: 520px;

      margin: 0 auto;

      color: var(--text-secondary);

      font-size: 14px;
      line-height: 1.65;
    }


    /* =====================================================
       SUGGESTIONS
    ===================================================== */

    .suggestions {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;

      margin-top: 26px;
    }

    .suggestion {
      display: flex;
      align-items: center;
      gap: 10px;

      padding: 12px 13px;

      border: 1px solid var(--border);
      border-radius: 7px;

      background: var(--surface);

      color: var(--text-secondary);

      text-align: left;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .suggestion:hover {
      background: var(--surface-hover);

      border-color:
        rgba(88, 101, 242, 0.4);

      color: var(--text);
    }

    .suggestion-icon {
      flex-shrink: 0;

      color: var(--accent);
    }

    .suggestion-icon svg {
      width: 17px;
      height: 17px;
    }

    .suggestion-text {
      font-size: 12px;
      line-height: 1.4;
    }


    /* =====================================================
       MESSAGE ROW
    ===================================================== */

    .message-row {
      width: 100%;

      display: flex;

      padding: 8px 24px;

      animation: messageIn 0.2s ease;
    }

    .message-row:hover {
      background: rgba(0, 0, 0, 0.025);
    }

    [data-theme="dark"]
    .message-row:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.ai {
      justify-content: flex-start;
    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    .message {
      max-width: min(82%, 780px);

      position: relative;
    }

    .message-row.user .message {
      padding: 10px 14px;

      border-radius: 8px 8px 2px 8px;

      background: var(--user-message);
    }

    .message-row.ai .message {
      width: 100%;

      padding: 2px 0;
    }

    .message-content {
      font-size: 14px;
      line-height: 1.65;

      word-break: break-word;
    }

    .message-row.user .message-content {
      white-space: pre-wrap;

      line-height: 1.5;
    }


    /* =====================================================
       MARKDOWN
    ===================================================== */

    .message-content p {
      margin-bottom: 12px;
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3,
    .message-content h4 {
      margin: 20px 0 9px;

      line-height: 1.35;
    }

    .message-content h1 {
      font-size: 23px;
    }

    .message-content h2 {
      font-size: 19px;
    }

    .message-content h3 {
      font-size: 16px;
    }

    .message-content ul,
    .message-content ol {
      margin: 9px 0 14px;

      padding-left: 22px;
    }

    .message-content li {
      margin: 5px 0;
    }

    .message-content blockquote {
      margin: 13px 0;

      padding: 9px 13px;

      border-left:
        3px solid var(--accent);

      background:
        rgba(88, 101, 242, 0.08);

      color: var(--text-secondary);
    }

    .message-content a {
      color: #8ea1ff;

      text-decoration: underline;

      text-underline-offset: 2px;
    }

    .message-content code:not(pre code) {
      padding: 2px 5px;

      border-radius: 4px;

      background: var(--background-tertiary);

      color: #e8e8ff;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 0.88em;
    }


    /* =====================================================
       CODE
    ===================================================== */

    .code-wrapper {
      margin: 14px 0;

      overflow: hidden;

      border:
        1px solid rgba(255, 255, 255, 0.05);

      border-radius: 7px;

      background: var(--code-bg);
    }

    .code-header {
      min-height: 34px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 10px;

      background: var(--background-tertiary);

      color: var(--text-muted);

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 10px;
    }

    .code-copy {
      padding: 4px 7px;

      border-radius: 4px;

      background: rgba(255, 255, 255, 0.05);

      color: var(--text-secondary);

      cursor: pointer;

      font-size: 10px;
    }

    .code-copy:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .message-content pre {
      margin: 0;

      padding: 14px;

      overflow-x: auto;

      background: var(--code-bg);

      color: #e6edf3;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 12px;

      line-height: 1.6;
    }


    /* =====================================================
       TABLES
    ===================================================== */

    .message-content table {
      width: 100%;

      margin: 14px 0;

      border-collapse: collapse;

      font-size: 12px;
    }

    .message-content th,
    .message-content td {
      padding: 8px 10px;

      border:
        1px solid var(--border);

      text-align: left;
    }

    .message-content th {
      background: var(--surface);
    }


    /* =====================================================
       MESSAGE TOOLS
    ===================================================== */

    .message-tools {
      display: flex;
      align-items: center;

      gap: 3px;

      margin-top: 6px;

      opacity: 0;

      transition: opacity 0.15s ease;
    }

    .message-row.ai:hover .message-tools {
      opacity: 1;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 5px;

      padding: 5px 7px;

      border-radius: 5px;

      background: transparent;

      color: var(--text-muted);

      cursor: pointer;

      font-size: 10px;
    }

    .tool-btn:hover {
      background: var(--surface-hover);

      color: var(--text);
    }

    .tool-btn svg {
      width: 13px;
      height: 13px;
    }


    /* =====================================================
       TYPING
    ===================================================== */

    .typing {
      display: flex;
      align-items: center;
      gap: 4px;

      padding: 9px 0;
    }

    .typing-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--text-muted);

      animation:
        typing 1.1s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }


    /* =====================================================
       COMPOSER
    ===================================================== */

    .composer-wrap {
      flex-shrink: 0;

      padding: 10px 18px 16px;

      background: var(--background-secondary);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 8px;

      padding: 8px 8px 8px 13px;

      border:
        1px solid rgba(255, 255, 255, 0.06);

      border-radius: 8px;

      background: var(--input);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    [data-theme="light"] .composer {
      border-color:
        rgba(0, 0, 0, 0.08);
    }

    .composer:focus-within {
      border-color:
        rgba(88, 101, 242, 0.65);

      box-shadow:
        0 0 0 1px
        rgba(88, 101, 242, 0.25);
    }

    .composer textarea {
      flex: 1;

      min-height: 42px;
      max-height: 180px;

      resize: none;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text);

      padding: 9px 2px;

      font-size: 14px;

      line-height: 1.5;
    }

    .composer textarea::placeholder {
      color: var(--text-muted);
    }


    /* =====================================================
       SEND
    ===================================================== */

    .send-btn {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      display: grid;
      place-items: center;

      border-radius: 6px;

      background: var(--accent);

      color: white;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);

      transform: translateY(-1px);
    }

    .send-btn:disabled {
      opacity: 0.35;

      cursor: not-allowed;
    }

    .send-btn.stop {
      background: var(--danger);
    }

    .send-btn svg {
      width: 17px;
      height: 17px;
    }


    /* =====================================================
       COMPOSER FOOTER
    ===================================================== */

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 6px 2px 0;

      color: var(--text-muted);

      font-size: 10px;
    }

    .shortcut {
      display: flex;
      align-items: center;

      gap: 4px;
    }

    kbd {
      padding: 2px 5px;

      border:
        1px solid var(--border);

      border-radius: 3px;

      background: var(--background-tertiary);

      font-family: inherit;

      font-size: 9px;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {
      flex-shrink: 0;

      padding: 0 20px 12px;

      text-align: center;

      color: var(--text-muted);

      font-size: 10px;
    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translate(-50%, 15px);

      padding: 9px 13px;

      border:
        1px solid var(--border);

      border-radius: 6px;

      background:
        var(--background-tertiary);

      color: var(--text);

      box-shadow: var(--shadow);

      font-size: 12px;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;

      z-index: 100;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }


    /* =====================================================
       ANIMATIONS
    ===================================================== */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .topbar {
        height: 56px;

        padding:
          0 12px;
      }

      .brand-subtitle {
        display: none;
      }

      .main {
        padding: 0;
      }

      .chat {
        width: 100%;
        height: calc(100vh - 56px);

        min-height: 0;

        border-radius: 0;

        border-left: 0;
        border-right: 0;

        box-shadow: none;
      }

      .messages {
        padding:
          18px 0 24px;
      }

      .message-row {
        padding:
          7px 14px;
      }

      .message {
        max-width: 92%;
      }

      .welcome {
        margin:
          55px auto 40px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .composer-wrap {
        padding:
          8px 10px 10px;
      }

      .composer-footer {
        padding-left: 2px;
        padding-right: 2px;
      }

      .shortcut {
        display: none;
      }

      .footer {
        display: none;
      }

      .message-tools {
        opacity: 1;
      }
    }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation-duration:
          0.01ms !important;

        transition-duration:
          0.01ms !important;
      }
    }
  </style>

</head>

<script>

/* =========================================================

  "https://YOUR-WORKER.workers.dev";


/*
 * The Worker is responsible for:
 *
 * - OpenRouter authentication
 * - API key security
 * - model selection
 * - streaming
 */

const MODEL =
  "openrouter/free";


const SYSTEM_PROMPT = `
You are Free AI, a helpful and capable AI assistant.

Give accurate, useful and direct answers.

When appropriate:
- Use clear headings.
- Use bullet points and numbered lists.
- Use Markdown.
- Use fenced code blocks for code.

`;


/* =========================================================

/* =========================================================

let conversation = [];

let controller = null;

  "free-ai-theme";


/* =========================================================
   THEME
========================================================= */

function loadTheme() {

  const saved =
    localStorage.getItem(THEME_KEY);

  if (saved) {

    html.dataset.theme =
      saved;

    return;
  }


  const prefersDark =
    window.matchMedia &&
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    ).matches;


  html.dataset.theme =
    prefersDark
      ? "dark"
      : "light";
}

        M4.93 19.07l1.42-1.42
        M17.65 6.35l1.42-1.42
      "/>
    `;

  } else {

    themeIcon.innerHTML = `
      <path
        d="
          M21 12.8

          11.2 3
          A6.7 6.7 0 0 0
          21 12.8z

}


themeBtn.addEventListener(

loadTheme();
updateThemeIcon();


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

    message;

  toastEl.classList.add(
    "show"

  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(() => {

      toastEl.classList.remove(
        "show"

/* =========================================================
   MARKDOWN
========================================================= */

marked.setOptions({
  breaks: true,
  gfm: true
});


function renderMarkdown(content) {

  const raw =
    marked.parse(content);


  return DOMPurify.sanitize(
    raw,
    {
      USE_PROFILES: {
        html: true
      }
    }
  );
}


/* =========================================================
   CODE BLOCKS
========================================================= */

function enhanceCodeBlocks(
  container
) {

  const blocks =
    container.querySelectorAll(
      "pre"
    );


  blocks.forEach(pre => {

    if (
      pre.parentElement &&
      pre.parentElement.classList.contains(
        "code-wrapper"
      )
    ) {
      return;
    }


    const code =
      pre.querySelector("code");


    if (!code) {
      return;
    }


    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "code-wrapper";


    const header =
      document.createElement(
        "div"
      );

    header.className =
      "code-header";


    let language =
      "code";


    const languageClass =
      Array.from(
        code.classList
      ).find(
        className =>
          className.startsWith(
            "language-"
          )
      );


    if (languageClass) {

      language =
        languageClass.replace(
          "language-",
          ""
        );
    }


    const languageLabel =
      document.createElement(
        "span"
      );

    languageLabel.textContent =
      language;


    const copyButton =
      document.createElement(
        "button"
      );

    copyButton.className =
      "code-copy";

    copyButton.type =
      "button";

    copyButton.textContent =
      "Copy";


    copyButton.addEventListener(
      "click",
      async () => {

        try {

          await navigator.clipboard
            .writeText(
              code.textContent
            );


          copyButton.textContent =
            "Copied";


          setTimeout(() => {

            copyButton.textContent =
              "Copy";

          }, 1500);

        } catch {

          showToast(
            "Unable to copy code."
          );

        }

      }
    );


    header.appendChild(
      languageLabel
    );

    header.appendChild(
      copyButton
    );


    pre.parentNode.insertBefore(
      wrapper,
      pre
    );


    wrapper.appendChild(
      header
    );

    wrapper.appendChild(
      pre
    );

  });
}


/* =========================================================
   USER MESSAGE
========================================================= */

function addUserMessage(

) {

  hideWelcome();


  const row =

/* =========================================================
   AI MESSAGE
========================================================= */

function addAIMessage(
  content = ""
) {

  hideWelcome();


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row ai";


  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message";


  const messageContent =
    document.createElement(
      "div"
    );

  messageContent.className =
    "message-content";


  message.appendChild(
    messageContent
  );


  const tools =
    document.createElement(
      "div"
    );

  tools.className =
    "message-tools";


  const copyBtn =
    createToolButton(
      "Copy",
      `
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect
            x="9"
            y="9"
            width="11"
            height="11"
            rx="2"
          />

          <path
            d="
              M5 15H4
              a2 2 0 0 1-2-2V4
              a2 2 0 0 1 2-2h9
              a2 2 0 0 1 2 2v1
            "
          />
        </svg>
      `
    );


  copyBtn.addEventListener(
    "click",
    async () => {

      const currentContent =
        row.dataset.content || "";


      try {

        await navigator.clipboard
          .writeText(
            currentContent
          );


        showToast(
          "Response copied"
        );

      } catch {

        showToast(
          "Unable to copy response"
        );

      }

    }
  );


  tools.appendChild(
    copyBtn
  );


  message.appendChild(
    tools
  );


  row.appendChild(
    message
  );


  messagesEl.appendChild(
    row
  );


  if (content) {

    updateAIMessage(
      row,

    );

  }


  scrollToBottom();


  return row;
}


/* =========================================================
   TOOL BUTTON
========================================================= */

function createToolButton(

  button.type =

  button.className =

/* =========================================================
   UPDATE AI MESSAGE
========================================================= */

function updateAIMessage(
  row,
  content
) {

  row.dataset.content =
    content;


  const contentEl =
    row.querySelector(
      ".message-content"

  contentEl.innerHTML =

}


/* =========================================================
   TYPING
========================================================= */

function addTypingMessage() {

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row ai";

  row.id =
    "typing-message";


  const message =

    <div class="typing">

      <span class="typing-dot"></span>

      <span class="typing-dot"></span>

  `;


  row.appendChild(

  );

  return row;
}


/* =========================================================
   WELCOME
========================================================= */

function hideWelcome() {

  if (welcomeEl) {

    welcomeEl.style.display =
      "none";

  }
}


function showWelcome() {

  if (welcomeEl) {

    welcomeEl.style.display =
      "";

  }
}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

  requestAnimationFrame(() => {

    messagesEl.scrollTop =
      messagesEl.scrollHeight;

  });
}


/* =========================================================
   INPUT
========================================================= */

function resizeInput() {

  userInput.style.height =
    "auto";


  userInput.style.height =
    Math.min(
      userInput.scrollHeight,
      180
    ) + "px";
}


userInput.addEventListener(
  "input",
  resizeInput
);


/* =========================================================
   SEND BUTTON
========================================================= */

function updateSendButton() {

  if (isGenerating) {

    sendBtn.disabled =
      false;

    sendBtn.classList.add(
      "stop"
    );


    sendBtn.title =
      "Stop generation";

    sendBtn.setAttribute(
      "aria-label",
      "Stop generation"
    );


    sendIcon.innerHTML = `
      <rect
        x="7"
        y="7"
        width="10"
        height="10"
        rx="2"
      />
    `;


    return;
  }


  sendBtn.classList.remove(
    "stop"
  );


  sendBtn.title =
    "Send message";

  sendBtn.setAttribute(
    "aria-label",
    "Send message"
  );


  sendIcon.innerHTML = `
    <path d="M22 2L11 13"/>

    <path
      d="
        M22 2
        l-7 20
        -4-9
        -9-4
        20-7z
      "
    />
  `;


  sendBtn.disabled =
    !userInput.value.trim();
}


userInput.addEventListener(
  "input",
  updateSendButton
);


/* =========================================================
   STREAMING RESPONSE
========================================================= */

/*
 * OpenRouter streaming responses use SSE.
 *
 * The Worker should forward the stream directly.
 *
 * Each event looks approximately like:
 *
 * data: {"choices":[{"delta":{"content":"Hello"}}]}
 *
 * The stream ends with:
 *
 * data: [DONE]
 */


async function readStreamingResponse(
  response,
  aiRow
) {

  if (!response.body) {

    throw new Error(
      "Streaming is not supported by this response."
    );

  }


  const reader =
    response.body.getReader();


  const decoder =
    new TextDecoder(
      "utf-8"
    );


  let buffer = "";

  let fullContent = "";


  while (true) {

    const {
      value,
      done
    } =
      await reader.read();


    if (done) {
      break;
    }


    buffer +=
      decoder.decode(
        value,
        {
          stream: true
        }
      );


    const lines =
      buffer.split("\n");


    /*
     * Keep the final incomplete line
     * for the next chunk.
     */

    buffer =
      lines.pop() || "";


    for (
      const rawLine of lines
    ) {

      const line =
        rawLine.trim();


      if (!line) {
        continue;
      }


      if (
        !line.startsWith(
          "data:"
        )
      ) {
        continue;
      }


      const data =
        line.slice(5).trim();


      if (
        data === "[DONE]"
      ) {

        continue;
      }


      let parsed;


      try {

        parsed =
          JSON.parse(data);

      } catch {

        /*
         * SSE chunks should normally contain
         * complete JSON objects, but if a
         * malformed event arrives we simply
         * ignore it.
         */

        continue;
      }


      const delta =
        parsed
          ?.choices?.[0]
          ?.delta
          ?.content;


      if (
        typeof delta !==
        "string"
      ) {
        continue;
      }


      fullContent +=
        delta;


      updateAIMessage(
        aiRow,
        fullContent
      );

    }

  }


  return fullContent;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  if (isGenerating) {

    stopGeneration();

    return;
  }


  const text =
    userInput.value.trim();


  if (!text) {
    return;
  }


  /*
   * Make sure the developer replaced
   * the Worker URL.
   */

  if (
    API_URL.includes(
      "YOUR-WORKER"
    )
  ) {

    showToast(
      "Set your Cloudflare Worker URL first."
    );

    return;
  }


  userInput.value =
    "";

  resizeInput();


  addUserMessage(
    text
  );


  conversation.push({
    role: "user",
    content: text
  });


  saveConversation();


  isGenerating =
    true;


  controller =
    new AbortController();


  updateSendButton();


  const typing =
    addTypingMessage();


  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          signal:
            controller.signal,

          body:
            JSON.stringify({

              /*
               * The Worker chooses
               * openrouter/free.
               */

              messages: [
                {
                  role: "system",
                  content:
                    SYSTEM_PROMPT
                },

                ...conversation
              ],

              temperature:
                0.7,

              max_tokens:
                4096,

              /*
               * This is the important
               * streaming option.
               */

              stream:
                true

            })
        }
      );


    /*
     * If OpenRouter / Worker returned
     * an error, try to extract the
     * useful message.
     */

    if (!response.ok) {

      let errorMessage =
        `Request failed (${response.status})`;


      try {

        const errorData =
          await response.json();


        if (
          errorData?.error?.message
        ) {

          errorMessage =
            errorData.error.message;

        } else if (
          typeof errorData?.error ===
          "string"
        ) {

          errorMessage =
            errorData.error;

        }

      } catch {

        /*
         * Ignore invalid error JSON.
         */

      }


      throw new Error(
        errorMessage
      );
    }


    /*
     * Remove the three-dot
     * typing indicator.
     */

    typing.remove();


    /*
     * Create an empty AI message.
     * Content will be filled in
     * progressively as tokens arrive.
     */

    const aiRow =
      addAIMessage(
        ""
      );


    /*
     * Read the OpenRouter SSE stream.
     */

    const answer =
      await readStreamingResponse(
        response,
        aiRow
      );


    if (!answer) {

      throw new Error(
        "The AI returned an empty response."
      );

    }


    /*
     * Save the complete answer
     * only after streaming finishes.
     */

    conversation.push({
      role: "assistant",
      content: answer
    });


    saveConversation();


  } catch (error) {

    typing.remove();


    /*
     * AbortError means the user
     * intentionally stopped generation.
     */

    if (
      error.name ===
      "AbortError"
    ) {

      showToast(
        "Generation stopped"
      );

      return;
    }


    console.error(
      "AI error:",
      error
    );


    addAIMessage(
      `### Something went wrong

${error.message || "Unable to connect to the AI service."}

Please try again in a moment.`
    );


  } finally {

    isGenerating =
      false;

    controller =
      null;


    updateSendButton();

    userInput.focus();

  }
}


/* =========================================================
   STOP GENERATION
========================================================= */

function stopGeneration() {

  if (controller) {

    controller.abort();

  }


  isGenerating =
    false;

  controller =
    null;


  const typing =
    document.getElementById(
      "typing-message"
    );


  if (typing) {
    typing.remove();
  }


  updateSendButton();

  userInput.focus();
}


/* =========================================================
   CLEAR CONVERSATION
========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    if (isGenerating) {
      stopGeneration();
    }


    conversation =
      [];


    localStorage.removeItem(
      STORAGE_KEY
    );


    const rows =
      messagesEl.querySelectorAll(
        ".message-row"
      );


    rows.forEach(
      row =>
        row.remove()
    );


    showWelcome();


    showToast(
      "Conversation cleared"
    );

  }
);


/* =========================================================
   LOCAL STORAGE
========================================================= */

function saveConversation() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(
        conversation
      )
    );

  } catch (error) {

    console.warn(
      "Could not save conversation.",
      error
    );

  }
}


function loadConversation() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!saved) {
      return;
    }


    const parsed =
      JSON.parse(saved);


    if (
      !Array.isArray(parsed)
    ) {

      return;

    }


    conversation =
      parsed;


    if (
      conversation.length === 0
    ) {

      return;

    }


    hideWelcome();


    conversation.forEach(
      message => {

        if (
          message.role ===
          "user"
        ) {

          addUserMessage(
            message.content
          );

        }


        if (
          message.role ===
          "assistant"
        ) {

          addAIMessage(
            message.content
          );

        }

      }
    );


    scrollToBottom();


  } catch (error) {

    console.warn(
      "Could not restore conversation.",
      error
    );


    conversation =
      [];

  }
}


/* =========================================================
   SUGGESTIONS
========================================================= */

document
  .querySelectorAll(
    ".suggestion"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const prompt =
          button.dataset.prompt ||
          "";


        userInput.value =
          prompt;


        resizeInput();
        updateSendButton();


        userInput.focus();

      }
    );

  });


/* =========================================================
   KEYBOARD
========================================================= */

userInput.addEventListener(
  "keydown",
  event => {

    /*
     * Enter = send
     *
     * Shift + Enter = newline
     */

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();


      if (!isGenerating) {

        sendMessage();

      }

    }

  }
);


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================================
   INITIALIZATION
========================================================= */

loadConversation();

resizeInput();

updateSendButton();

userInput.focus();

</script>
