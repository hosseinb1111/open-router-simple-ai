<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Free AI — Sign in</title>

  <meta
    name="description"
    content="Sign in to Free AI and keep your conversations synced."
  >

  <meta
    name="theme-color"
    content="#313338"
  >

  <link
    rel="icon"
    href="favicon.ico"
    type="image/x-icon"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #313338;
      --surface: #2b2d31;
      --surface-hover: #35373c;

      --text: #f2f3f5;
      --text-secondary: #b5bac1;
      --text-muted: #949ba4;

      --accent: #5865f2;
      --accent-hover: #4752c4;

      --success: #23a559;
      --danger: #ed4245;

      --border: rgba(255, 255, 255, 0.08);

      --shadow:
        0 18px 55px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button {
      font: inherit;
      border: 0;
    }

    .card {
      width: 100%;
      max-width: 430px;

      padding: 34px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background:
        var(--surface);

      box-shadow:
        var(--shadow);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 18px;

      color: var(--text-muted);
      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);
    }

    h1 {
      font-size: 27px;
      line-height: 1.2;
      letter-spacing: -0.6px;

      margin-bottom: 10px;
    }

    .description {
      color: var(--text-secondary);

      font-size: 14px;
      line-height: 1.65;

      margin-bottom: 28px;
    }

    .google-button {
      width: 100%;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      border-radius: 7px;

      background: #ffffff;
      color: #1f1f1f;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .google-button:hover {
      background: #f1f1f1;
    }

    .google-button:active {
      transform: translateY(1px);
    }

    .google-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .google-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .message {
      min-height: 20px;

      margin-top: 14px;

      color: var(--danger);

      font-size: 12px;
      line-height: 1.5;
    }

    .message.info {
      color: var(--text-secondary);
    }

    .footer {
      margin-top: 26px;

      color: var(--text-muted);

      font-size: 10px;

      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .card {
        padding: 27px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="status">
      <span class="status-dot"></span>
      Free AI is online
    </div>

    <h1>
      Welcome to Free AI
    </h1>

    <p class="description">
      Sign in with Google to keep your conversations
      saved and available across your devices.
    </p>

    <button
      id="googleButton"
      class="google-button"
      type="button"
    >
      <svg
        class="google-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          fill="#4285F4"
          d="M21.35 12.18c0-.72-.06-1.41-.18-2.08H12v3.94h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.15c1.84-1.7 2.91-4.2 2.91-7.25Z"
        />
        <path
          fill="#34A853"
          d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.15-2.45c-.87.58-1.98.92-3.3.92-2.54 0-4.69-1.72-5.46-4.03H3.28v2.52A9.73 9.73 0 0 0 12 21.5Z"
        />
        <path
          fill="#FBBC05"
          d="M6.54 13.58A5.84 5.84 0 0 1 6.23 12c0-.55.11-1.09.31-1.58V7.9H3.28A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.03 4.1l3.26-2.52Z"
        />
        <path
          fill="#EA4335"
          d="M12 6.39c1.43 0 2.71.49 3.72 1.45l2.8-2.79C16.83 3.48 14.63 2.5 12 2.5a9.73 9.73 0 0 0-8.72 5.4l3.26 2.52C7.31 8.11 9.46 6.39 12 6.39Z"
        />
      </svg>

      <span id="googleButtonText">
        Continue with Google
      </span>
    </button>

    <div
      id="message"
      class="message"
    ></div>

    <div class="footer">
      Sign-in is handled securely by Supabase Auth.
    </div>

  </main>


  <script>
    /* =====================================================
       CONFIGURATION
    ===================================================== */

    const SUPABASE_URL =
      "https://houpacapqrrvfqzzrlxs.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_YlFSX-js_1YUsqGxc4BeHQ_bhmlE5Le";


    const CHAT_URL =
      "./chat.html";


    /* =====================================================
       SUPABASE
    ===================================================== */

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    /* =====================================================
       DOM
    ===================================================== */

    const googleButton =
      document.getElementById(
        "googleButton"
      );

    const googleButtonText =
      document.getElementById(
        "googleButtonText"
      );

    const messageEl =
      document.getElementById(
        "message"
      );


    /* =====================================================
       HELPERS
    ===================================================== */

    function showMessage(
      message,
      type = "error"
    ) {
      messageEl.textContent =
        message;

      messageEl.className =
        type === "info"
          ? "message info"
          : "message";
    }


    function setButtonLoading(
      loading
    ) {
      googleButton.disabled =
        loading;

      googleButtonText.textContent =
        loading
          ? "Connecting..."
          : "Continue with Google";
    }


    /* =====================================================
       SESSION CHECK
    ===================================================== */

    async function checkExistingSession() {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .getSession();


      if (error) {

        console.error(
          "Session check failed:",
          error
        );

        return;
      }


      if (
        data &&
        data.session
      ) {

        window.location.replace(
          CHAT_URL
        );
      }
    }


    /* =====================================================
       GOOGLE LOGIN
    ===================================================== */

    async function signInWithGoogle() {

      showMessage(
        "Redirecting to Google...",
        "info"
      );

      setButtonLoading(
        true
      );


      try {

        const redirectTo =
          new URL(
            CHAT_URL,
            window.location.href
          ).href;


        const {
          error
        } =
          await supabaseClient.auth
            .signInWithOAuth({
              provider: "google",

              options: {
                redirectTo
              }
            });


        if (error) {
          throw error;
        }

      } catch (error) {

        console.error(
          "Google sign-in failed:",
          error
        );

        showMessage(
          error.message ||
            "Could not start Google sign-in."
        );

        setButtonLoading(
          false
        );
      }
    }


    /* =====================================================
       AUTH STATE
    ===================================================== */

    supabaseClient.auth
      .onAuthStateChange(
        (
          event,
          session
        ) => {

          if (
            session &&
            (
              event ===
                "SIGNED_IN" ||
              event ===
                "INITIAL_SESSION"
            )
          ) {

            window.location.replace(
              CHAT_URL
            );
          }
        }
      );


    /* =====================================================
       EVENTS
    ===================================================== */

    googleButton.addEventListener(
      "click",
      signInWithGoogle
    );


    /* =====================================================
       START
    ===================================================== */

    checkExistingSession();
  </script>

</body>
</html>
